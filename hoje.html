<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melo Reparos — Hoje</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f4f8;--surface:#fff;--surface2:#f7f9fc;--border:#dde3ec;
  --blue:#1a56db;--blue-light:#e8f0fd;--blue-mid:#3b6fd4;
  --yellow:#f5a800;--yellow-lt:#fff8e6;
  --green:#16a34a;--green-lt:#dcfce7;
  --red:#dc2626;--red-lt:#fee2e2;
  --orange:#ea580c;--orange-lt:#ffedd5;
  --purple:#7c3aed;--purple-lt:#ede9fe;
  --teal:#0d9488;--teal-lt:#ccfbf1;
  --pink:#db2777;--pink-lt:#fce7f3;
  --text:#0f1b2d;--text-muted:#5a6a7e;--text-dim:#94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--blue);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:62px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(26,86,219,.25);}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;letter-spacing:3px;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:10px;}
.logo-accent{color:var(--yellow);}.logo-bar{width:3px;height:22px;background:var(--yellow);border-radius:2px;}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}.last-update{font-size:12px;color:rgba(255,255,255,.65);}.last-update strong{color:#fff;}
.hbtn{border:none;padding:8px 15px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;border-radius:5px;display:flex;align-items:center;gap:6px;transition:background .15s,transform .1s;box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap;}
.hbtn:hover{transform:translateY(-1px);}.hbtn svg{width:14px;height:14px;flex-shrink:0;}.hbtn-yellow{background:var(--yellow);color:#000;}.hbtn-outline{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);}
main{padding:24px 28px;display:flex;flex-direction:column;gap:22px;max-width:1600px;margin:0 auto;}
.hero{background:linear-gradient(135deg,#fff,#f7f9fc);border:1px solid var(--border);border-radius:14px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.hero-title{font-family:'Barlow Condensed';font-weight:900;font-size:34px;letter-spacing:2px;text-transform:uppercase;color:var(--blue);line-height:1;}
.hero-sub{font-size:14px;color:var(--text-muted);margin-top:6px;}.today-pill{background:var(--yellow-lt);border:1px solid #fde68a;color:#92400e;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1px;}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.05);position:relative;overflow:hidden;}
.sum-card::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--sc,var(--blue));}.sum-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);}.sum-value{font-family:'Barlow Condensed';font-weight:900;font-size:34px;line-height:1;margin-top:6px;}.sum-sub{font-size:11px;color:var(--text-muted);margin-top:4px;}
.board-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;align-items:start;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;}
.panel-hdr{padding:13px 16px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.panel-title{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed';font-weight:900;font-size:16px;letter-spacing:1.8px;text-transform:uppercase;color:var(--blue);}.panel-count{background:var(--blue-light);border:1px solid #c7d8f8;color:var(--blue);font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;text-transform:uppercase;letter-spacing:.5px;}
.panel-body{padding:12px;display:flex;flex-direction:column;gap:9px;min-height:150px;max-height:460px;overflow:auto;}
.item{border:1px solid var(--border);background:var(--surface2);border-radius:9px;padding:11px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;transition:border-color .12s,transform .12s,box-shadow .12s;}
.item:hover{border-color:var(--blue);transform:translateY(-1px);box-shadow:0 2px 10px rgba(26,86,219,.10);}.item-main{min-width:0;}.plate{font-family:'Barlow Condensed';font-weight:900;font-size:17px;letter-spacing:2px;color:var(--blue);}.car{font-size:12px;color:var(--text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.muted{font-size:11px;color:var(--text-muted);margin-top:2px;}.value{font-family:'Barlow Condensed';font-weight:900;font-size:21px;white-space:nowrap;}.value.in{color:var(--green);}.value.out{color:var(--red);}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.5px;}.b-green{background:var(--green-lt);color:var(--green);}.b-red{background:var(--red-lt);color:var(--red);}.b-blue{background:var(--blue-light);color:var(--blue);}.b-orange{background:var(--orange-lt);color:var(--orange);}.b-purple{background:var(--purple-lt);color:var(--purple);}.b-gray{background:#e5e7eb;color:#475569;}
.empty{padding:34px 12px;text-align:center;color:var(--text-muted);font-size:13px;background:#fafbfc;border:1px dashed var(--border);border-radius:10px;}.empty strong{font-family:'Barlow Condensed';display:block;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-bottom:3px;}
.alert-line{background:var(--yellow-lt);border:1px solid #fde68a;border-left:4px solid var(--yellow);border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}.alert-line strong{font-family:'Barlow Condensed';font-size:17px;letter-spacing:1px;text-transform:uppercase;color:#92400e;}.alert-line span{font-size:13px;color:#7c2d12;}.alert-line.error{background:var(--red-lt);border-color:#fecaca;border-left-color:var(--red);}.alert-line.error strong{color:#991b1b}.alert-line.error span{color:#7f1d1d}.money-mini{font-family:'Barlow Condensed';font-size:23px;font-weight:900;color:#92400e;}

.week-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;}
.week-top{padding:14px 18px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.week-title{font-family:'Barlow Condensed';font-weight:900;font-size:18px;letter-spacing:2px;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:8px;}
.week-summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.week-pill{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);}
.week-pill.in{border-color:#bbf7d0;background:var(--green-lt);color:var(--green);}.week-pill.out{border-color:#fecaca;background:var(--red-lt);color:var(--red);}.week-pill.balance{border-color:#c7d8f8;background:var(--blue-light);color:var(--blue);}
.week-diagnostic{margin:14px 18px 0;padding:11px 14px;border-radius:10px;border:1px solid #c7d8f8;border-left:4px solid var(--blue);background:var(--blue-light);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.week-diagnostic strong{font-family:'Barlow Condensed';font-size:16px;letter-spacing:1px;text-transform:uppercase;color:var(--blue);}.week-diagnostic span{font-size:13px;color:var(--text-muted);}
.week-strip{position:relative;margin:18px;padding:18px 10px 20px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.week-strip::before{content:'';position:absolute;left:24px;right:24px;top:50%;height:3px;background:var(--blue-light);border-radius:99px;z-index:0;}
.week-day{position:relative;z-index:1;background:#fff;border:1px solid var(--border);border-radius:12px;min-height:190px;padding:12px 10px;box-shadow:0 1px 4px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:9px;}
.week-day.today{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(245,168,0,.12);background:linear-gradient(180deg,var(--yellow-lt),#fff 42%);}
.week-day.today::before{content:'HOJE';position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--yellow);color:#000;border-radius:999px;padding:2px 9px;font-size:9px;font-weight:900;letter-spacing:1px;}
.week-day-head{text-align:center;border-bottom:1px solid var(--border);padding-bottom:8px;}
.week-dow{font-family:'Barlow Condensed';font-size:15px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);line-height:1;}.week-date{font-size:11px;font-weight:700;color:var(--text-muted);margin-top:3px;}
.week-metrics{display:flex;flex-direction:column;gap:6px;}.week-metric{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--text-muted);}.week-metric b{font-family:'Barlow Condensed';font-size:15px;color:var(--text);}.week-metric .money{font-size:14px;white-space:nowrap;}
.week-balance{margin-top:auto;border-top:1px dashed var(--border);padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}.week-balance span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);}.week-balance b{font-family:'Barlow Condensed';font-size:18px;white-space:nowrap;color:var(--blue);}.week-balance.neg b{color:var(--red);}.week-balance.pos b{color:var(--green);}
@media(max-width:1100px){.week-strip{overflow:auto;grid-template-columns:repeat(7,minmax(150px,1fr));}.week-panel{overflow:hidden;}}

@media(max-width:1100px){.summary-grid,.board-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:720px){main{padding:16px}.summary-grid,.board-grid{grid-template-columns:1fr}.hero-title{font-size:28px}.hdr-right .last-update{display:none}}

.week-day{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;}
.week-day:hover{border-color:var(--blue);box-shadow:0 6px 16px rgba(26,86,219,.12);transform:translateY(-2px);}
.week-day.selected{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12),0 6px 16px rgba(26,86,219,.10);}
.week-detail{margin:0 18px 18px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;display:none;}
.week-detail.show{display:block;}
.week-detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:12px;}
.week-detail-title{font-family:'Barlow Condensed';font-size:18px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);}
.week-detail-total{display:flex;gap:8px;flex-wrap:wrap;}
.week-detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.week-detail-col{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;min-height:120px;}
.week-detail-col-h{padding:9px 11px;background:var(--surface);border-bottom:1px solid var(--border);font-family:'Barlow Condensed';font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue);display:flex;justify-content:space-between;gap:8px;}
.week-detail-list{padding:8px;display:flex;flex-direction:column;gap:7px;max-height:260px;overflow:auto;}
.week-mini{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:8px 9px;}
.week-mini-title{font-size:12px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.week-mini-sub{font-size:11px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.week-mini-value{font-family:'Barlow Condensed';font-size:17px;font-weight:900;margin-top:4px;}
.week-mini-value.in{color:var(--green);}.week-mini-value.out{color:var(--red);}
.week-detail-empty{padding:14px 10px;text-align:center;color:var(--text-dim);font-size:12px;}
@media(max-width:1100px){.week-detail-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:700px){.week-detail-grid{grid-template-columns:1fr;}}



/* ── NAVEGAÇÃO PRINCIPAL (PR11) ── */
.app-tabs{position:sticky;top:62px;z-index:170;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.04);padding:8px 24px;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:thin;}
.app-tab{border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;text-decoration:none;border-radius:999px;padding:8px 13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .1s;}
.app-tab:hover{background:var(--blue-light);border-color:#c7d8f8;color:var(--blue);transform:translateY(-1px);}
.app-tab.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(26,86,219,.18);}
.app-tab.danger{border-color:#fecaca;background:var(--red-lt);color:var(--red);}
.app-tab.danger:hover{background:#fecaca;color:#991b1b;}
@media(max-width:760px){.app-tabs{top:auto;position:relative;padding:8px 12px;}.app-tab{font-size:11px;padding:7px 11px;}}

</style>

<main>

    <div><div class="hero-title">Resumo de Hoje</div><div class="hero-sub" id="heroSub">Entregas, agendamentos e pagamentos do dia</div></div>

  <section class="board-grid">
    <div class="panel"><div class="panel-hdr"><div class="panel-title">🚗 Carros para entrega</div><span class="panel-count" id="cEntregas">0</span></div><div class="panel-body" id="entregasList"></div></div>
    <div class="panel"><div class="panel-hdr"><div class="panel-title">📅 Carros agendados</div><span class="panel-count" id="cAgendados">0</span></div><div class="panel-body" id="agendadosList"></div></div>
    <div class="panel"><div class="panel-hdr"><div class="panel-title">💵 Receber hoje</div><span class="panel-count" id="cReceber">0</span></div><div class="panel-body" id="receberList"></div></div>

<script>
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function readStoredJSON(key){
  const sources=[sessionStorage,localStorage];
  for(const source of sources){
    try{
      const raw=source.getItem(key);
      if(raw)return JSON.parse(raw);
    }catch(e){console.warn('Falha ao ler dados salvos:',key,e);}
  }
  return null;
}
function hasStoredKey(key){
  try{if(sessionStorage.getItem(key))return true;}catch(e){}
  try{if(localStorage.getItem(key))return true;}catch(e){}
  return false;
}
function hasAnyStoredData(){return hasStoredKey('melohoje')||hasStoredKey('melorelatorio')||hasStoredKey('melofluxocaixa');}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function dateLocalFromISO(s){const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3],12):null;}
function todayISO(){const d=new Date();return ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()));}
function fmtDateISO(s){const d=dateLocalFromISO(s);return d?d.toLocaleDateString('pt-BR'):'—';}
function dateAnyToISO(v){
  if(!v&&v!==0)return '';
  if(typeof v==='string'){
    const s=v.trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
    const br=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if(br){const yy=br[3].length===2?'20'+br[3]:br[3];return `${yy}-${pad(br[2])}-${pad(br[1])}`;}
  }
  return excelDateToISO(v);
}
function getAgendaISO(o){return dateAnyToISO(o&&((o.agendamentoISO)||(o.agendamento)||(o.agenda)));}
function getPrevEntregaISO(o){return dateAnyToISO(o&&((o.prevEntrega)||(o.entregaISO)||(o.entrega)));}
function fmtMoney(v){const n=Number(v)||0;return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function parseMoney(v){if(v===null||v===undefined||v==='')return 0;if(typeof v==='number')return v;let s=String(v).trim().replace(/R\$|\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');const n=Number(s);return isNaN(n)?0:n;}
function normHeader(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function excelDateToISO(v){
  if(!v&&v!==0)return '';
  if(v instanceof Date&&!isNaN(v))return ymd(new Date(v.getFullYear(),v.getMonth(),v.getDate()));
  if(typeof v==='number'){
    if(window.XLSX&&XLSX.SSF&&XLSX.SSF.parse_date_code){const d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${pad(d.m)}-${pad(d.d)}`;}
    const dt=new Date(1899,11,30);dt.setDate(dt.getDate()+Math.floor(Number(v)||0));return ymd(dt);
  }
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const br=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);if(br){const yy=br[3].length===2?'20'+br[3]:br[3];return `${yy}-${pad(br[2])}-${pad(br[1])}`;}
  const d=new Date(s);if(isNaN(d))return '';return ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()));
}
function rowGetter(row){const map={};Object.keys(row||{}).forEach(k=>{map[normHeader(k)]=row[k];});return function(...names){for(const n of names){const key=normHeader(n);if(Object.prototype.hasOwnProperty.call(map,key))return map[key];}return '';};}
function normalizeTipo(v){const n=normHeader(v);return n.includes('entrada')?'entrada':(n.includes('saida')?'saida':'');}
function normalizeStatus(v){const n=normHeader(v);return (n.includes('real')||n.includes('pago')||n.includes('quitado'))?'realizado':'previsto';}
function lancamentoFromRow(row,idx){
  const get=rowGetter(row);const tipo=normalizeTipo(get('Tipo'));if(!tipo)return null;
  const status=normalizeStatus(get('Status'));if(normHeader(get('Status')).includes('cancel'))return null;
  const dataPrev=excelDateToISO(get('Data prevista','Data Prevista'));
  const dataReal=excelDateToISO(get('Data realizada','Data Realizada'));
  const data=(status==='realizado'&&dataReal)?dataReal:dataPrev;if(!data)return null;
  const valorPrev=Math.abs(parseMoney(get('Valor previsto (R$)','Valor previsto','Valor Previsto')));
  const valorReal=Math.abs(parseMoney(get('Valor realizado (R$)','Valor realizado','Valor Realizado')));
  const valor=(status==='realizado'&&valorReal>0)?valorReal:valorPrev;if(!valor)return null;
  const os=String(get('OS')||'').trim(),veiculo=String(get('Veículo','Veiculo')||'').trim(),placa=String(get('Placa')||'').trim();
  const origem=[os,veiculo,placa].filter(Boolean).join(' • ')||String(get('Cliente / Fornecedor','Cliente','Fornecedor')||'—');
  return{id:Number(get('ID'))||idx+1,data,tipo,status,valor,desc:String(get('Descrição','Descricao')||get('Cliente / Fornecedor','Cliente','Fornecedor')||'Lançamento').trim(),cat:String(get('Categoria')||get('Natureza')||'Geral').trim(),origem,forma:String(get('Forma pagamento','Forma de pagamento')||'—').trim(),parcela:String(get('Parcela')||'').trim(),obs:String(get('Observação','Observacao')||'').trim()};
}
function loadData(){
  let packed=null;
  packed=readStoredJSON('melohoje');
  let rel=packed&&packed.relatorio?packed.relatorio:null;
  let fluxo=packed&&packed.fluxo?packed.fluxo:null;
  if(!rel){rel=readStoredJSON('melorelatorio');}
  if(!fluxo){fluxo=readStoredJSON('melofluxocaixa');}

  // PR18 corretivo: o resumo semanal precisa considerar agendamentos.
  // Algumas versões anteriores do pacote de relatório não levavam a data de agendamento;
  // por isso usamos o snapshot operacional como complemento, sem depender de nova importação.
  const oper=readStoredJSON('melooperacional');
  if(rel&&Array.isArray(rel.orcs)&&oper&&oper.active){
    const activeById=oper.active||{};
    rel={...rel,orcs:rel.orcs.map(o=>{
      const op=activeById[o.orcId]||activeById[String(o.orcId)]||null;
      if(!op)return o;
      return {...o,
        agendamento:o.agendamento||op.agendamento||'',
        agendamentoISO:dateAnyToISO(o.agendamento||op.agendamento||''),
        etapa:o.etapa||op.etapa||'',
        seguro:o.seguro||op.seguro||''
      };
    })};
  }

  const rows=fluxo?(fluxo.lancamentosRows||fluxo.lancamentos||[]):[];
  const lanc=rows.map(lancamentoFromRow).filter(Boolean).sort((a,b)=>a.data.localeCompare(b.data));
  return{rel:rel||{orcs:[]},lanc,filename:(packed&&packed.filename)||(fluxo&&fluxo.filename)||(oper&&oper.filename)||'Planilha carregada',missingSource:!hasAnyStoredData()};
}
function isOpenCar(o){return !o.entregue;}
function carItem(o,type){
  const tags=[]; if(o.tipo)tags.push(`<span class="badge b-blue">${escapeHtml(o.tipo)}</span>`); if(o.etapa)tags.push(`<span class="badge b-purple">${escapeHtml(o.etapa)}</span>`); if(o.entregue)tags.push(`<span class="badge b-green">Entregue</span>`);
  const dataTxt=type==='agenda'?`Agendado: ${fmtDateISO(getAgendaISO(o))}`:`Entrega: ${fmtDateISO(getPrevEntregaISO(o))}`;
  return `<div class="item"><div class="item-main"><div class="plate">${escapeHtml(o.placa||o.orcId||'—')}</div><div class="car">${escapeHtml(o.veiculo||o.carro||'—')}${o.cor?' · '+escapeHtml(o.cor):''}</div><div class="muted">${escapeHtml(o.cliente||'—')} · ${escapeHtml(dataTxt)}</div><div class="badges">${tags.join('')}</div></div></div>`;
}
function moneyItem(l){
  const cls=l.tipo==='entrada'?'in':'out'; const b=l.status==='realizado'?'b-green':(l.tipo==='entrada'?'b-blue':'b-orange'); const status=l.status==='realizado'?(l.tipo==='entrada'?'Recebido':'Pago'):'Previsto';
  return `<div class="item"><div class="item-main"><div class="car" style="font-weight:700">${escapeHtml(l.desc||'Lançamento')}</div><div class="muted">${escapeHtml(l.cat||'Geral')} · ${escapeHtml(l.origem||'—')}</div><div class="muted">${escapeHtml(l.forma||'—')}${l.parcela?' · '+escapeHtml(l.parcela):''}</div><div class="badges"><span class="badge ${b}">${status}</span></div></div><div class="value ${cls}">${fmtMoney(l.valor)}</div></div>`;
}

function weekMiniCar(o,type){
  const dataTxt=type==='agenda'?`Agendado ${fmtDateISO(getAgendaISO(o))}`:`Entrega ${fmtDateISO(getPrevEntregaISO(o))}`;
  return `<div class="week-mini"><div class="week-mini-title">${escapeHtml(o.placa||o.orcId||'—')} · ${escapeHtml(o.veiculo||o.carro||'Veículo')}</div><div class="week-mini-sub">${o.cor?escapeHtml(o.cor)+' · ':''}${escapeHtml(o.cliente||'—')}</div><div class="week-mini-sub">${escapeHtml(dataTxt)}${o.etapa?' · '+escapeHtml(o.etapa):''}</div></div>`;
}
function weekMiniMoney(l){
  const cls=l.tipo==='entrada'?'in':'out';
  const status=l.status==='realizado'?(l.tipo==='entrada'?'Confirmado':'Pago'):'Pendente';
  return `<div class="week-mini"><div class="week-mini-title">${escapeHtml(l.desc||'Lançamento')}</div><div class="week-mini-sub">${escapeHtml(l.cat||'Geral')} · ${status}</div><div class="week-mini-sub">${escapeHtml(l.origem||'—')}${l.forma?' · '+escapeHtml(l.forma):''}</div><div class="week-mini-value ${cls}">${fmtMoney(l.valor)}</div></div>`;
}
function renderWeekDayDetail(iso){
  const detail=document.getElementById('weekDayDetail');
  const stats=window._weekStats||[];
  const d=stats.find(x=>x.iso===iso);
  if(!detail||!d)return;
  const totalItens=d.entregas.length+d.agendados.length+d.receber.length+d.pagar.length;
  const cls=d.saldo<0?'out':'in';
  detail.classList.add('show');
  detail.innerHTML=`
    <div class="week-detail-head">
      <div class="week-detail-title">${shortDow(d.iso)} · ${formatShortDate(d.iso)} ${d.iso===todayISO()?' · Hoje':''}</div>
      <div class="week-detail-total">
        <span class="week-pill">${totalItens} item(ns)</span>
        <span class="week-pill in">Receber ${fmtMoney(d.receberTotal)}</span>
        <span class="week-pill out">Pagar ${fmtMoney(d.pagarTotal)}</span>
        <span class="week-pill balance">Saldo ${fmtMoney(d.saldo)}</span>
      </div>
    </div>
    <div class="week-detail-grid">
      <div class="week-detail-col"><div class="week-detail-col-h">🚗 Entregas <span>${d.entregas.length}</span></div><div class="week-detail-list">${d.entregas.length?d.entregas.map(o=>weekMiniCar(o,'entrega')).join(''):'<div class="week-detail-empty">Nenhuma entrega</div>'}</div></div>
      <div class="week-detail-col"><div class="week-detail-col-h">📅 Agendados <span>${d.agendados.length}</span></div><div class="week-detail-list">${d.agendados.length?d.agendados.map(o=>weekMiniCar(o,'agenda')).join(''):'<div class="week-detail-empty">Nenhum agendamento</div>'}</div></div>
      <div class="week-detail-col"><div class="week-detail-col-h">💵 Receber <span>${fmtMoney(d.receberTotal)}</span></div><div class="week-detail-list">${d.receber.length?d.receber.map(weekMiniMoney).join(''):'<div class="week-detail-empty">Nada a receber</div>'}</div></div>
      <div class="week-detail-col"><div class="week-detail-col-h">🧾 Pagar <span>${fmtMoney(d.pagarTotal)}</span></div><div class="week-detail-list">${d.pagar.length?d.pagar.map(weekMiniMoney).join(''):'<div class="week-detail-empty">Nada a pagar</div>'}</div></div>
    </div>`;
  document.querySelectorAll('.week-day').forEach(el=>el.classList.toggle('selected',el.dataset.iso===iso));
}
function selectWeekDay(iso){renderWeekDayDetail(iso);}
function setList(id,countId,items,emptyTitle,emptySub,renderer){
  document.getElementById(countId).textContent=items.length;
  document.getElementById(id).innerHTML=items.length?items.map(renderer).join(''):`<div class="empty"><strong>${escapeHtml(emptyTitle)}</strong>${escapeHtml(emptySub)}</div>`;
}

function addDaysISO(iso,days){const d=dateLocalFromISO(iso);d.setDate(d.getDate()+days);return ymd(d);}
function startOfWeekISO(iso){const d=dateLocalFromISO(iso);const offset=(d.getDay()+6)%7;d.setDate(d.getDate()-offset);return ymd(d);}
function shortDow(iso){const d=dateLocalFromISO(iso);return ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'][d.getDay()];}
function formatShortDate(iso){const d=dateLocalFromISO(iso);return d?`${pad(d.getDate())}/${pad(d.getMonth()+1)}`:'—';}
function renderWeek(rel,lanc,t){
  const orcs=(rel&&rel.orcs)||[];
  const start=startOfWeekISO(t);
  const dias=[0,1,2,3,4,5,6].map(i=>addDaysISO(start,i));
  const stats=dias.map(iso=>{
    const entregas=orcs.filter(o=>getPrevEntregaISO(o)===iso && (!o.entregue || o.entregue===iso));
    const agendados=orcs.filter(o=>getAgendaISO(o)===iso && !o.entregue);
    const receber=lanc.filter(l=>l.tipo==='entrada'&&l.data===iso);
    const pagar=lanc.filter(l=>l.tipo==='saida'&&l.data===iso);
    const receberTotal=receber.reduce((s,l)=>s+l.valor,0);
    const pagarTotal=pagar.reduce((s,l)=>s+l.valor,0);
    const receberAberto=receber.filter(l=>l.status!=='realizado').reduce((s,l)=>s+l.valor,0);
    const pagarAberto=pagar.filter(l=>l.status!=='realizado').reduce((s,l)=>s+l.valor,0);
    return{iso,entregas,agendados,receber,pagar,receberTotal,pagarTotal,receberAberto,pagarAberto,saldo:receberTotal-pagarTotal};
  });
  window._weekStats=stats;
  const totalReceber=stats.reduce((s,d)=>s+d.receberTotal,0);
  const totalPagar=stats.reduce((s,d)=>s+d.pagarTotal,0);
  const saldo=totalReceber-totalPagar;
  const totalEntregas=stats.reduce((s,d)=>s+d.entregas.length,0);
  const totalAgendados=stats.reduce((s,d)=>s+d.agendados.length,0);
  document.getElementById('weekSummary').innerHTML=`
    <span class="week-pill">🚗 ${totalEntregas} entregas</span>
    <span class="week-pill">📅 ${totalAgendados} agend.</span>
    <span class="week-pill in">Receber ${fmtMoney(totalReceber)}</span>
    <span class="week-pill out">Pagar ${fmtMoney(totalPagar)}</span>
    <span class="week-pill balance">Saldo ${fmtMoney(saldo)}</span>`;
  const heavy=stats.slice().sort((a,b)=>((b.entregas.length+b.agendados.length)-(a.entregas.length+a.agendados.length)) || ((b.receberTotal+b.pagarTotal)-(a.receberTotal+a.pagarTotal)))[0];
  const pendReceber=stats.filter(d=>d.iso<=t).reduce((s,d)=>s+d.receberAberto,0);
  const pendPagar=stats.filter(d=>d.iso<=t).reduce((s,d)=>s+d.pagarAberto,0);
  let titulo='Semana sob controle', texto='Agenda e caixa da semana estão distribuídos de forma equilibrada.';
  if(saldo<0){titulo='Atenção ao caixa da semana';texto=`Pagamentos superam recebimentos previstos em ${fmtMoney(Math.abs(saldo))}.`}
  else if((heavy.entregas.length+heavy.agendados.length)>=4){titulo='Dia operacional mais carregado';texto=`${shortDow(heavy.iso)} ${formatShortDate(heavy.iso)} concentra ${heavy.entregas.length} entrega(s) e ${heavy.agendados.length} agendamento(s).`}
  if(pendReceber||pendPagar){texto+=` Pendências até hoje: receber ${fmtMoney(pendReceber)} · pagar ${fmtMoney(pendPagar)}.`}
  document.getElementById('weekDiagnostic').innerHTML=`<div><strong>${titulo}</strong><br><span>${texto}</span></div>`;
  document.getElementById('weekStrip').innerHTML=stats.map(d=>{
    const balCls=d.saldo<0?'neg':(d.saldo>0?'pos':'');
    return `<div class="week-day ${d.iso===t?'today':''}" data-iso="${d.iso}" onclick="selectWeekDay('${d.iso}')" title="Clique para ver o resumo do dia">
      <div class="week-day-head"><div class="week-dow">${shortDow(d.iso)}</div><div class="week-date">${formatShortDate(d.iso)}</div></div>
      <div class="week-metrics">
        <div class="week-metric"><span>🚗 Entregas</span><b>${d.entregas.length}</b></div>
        <div class="week-metric"><span>📅 Agend.</span><b>${d.agendados.length}</b></div>
        <div class="week-metric"><span>💵 Receber</span><b class="money" style="color:var(--green)">${fmtMoney(d.receberTotal)}</b></div>
        <div class="week-metric"><span>🧾 Pagar</span><b class="money" style="color:var(--red)">${fmtMoney(d.pagarTotal)}</b></div>
      </div>
      <div class="week-balance ${balCls}"><span>Saldo dia</span><b>${fmtMoney(d.saldo)}</b></div>
    </div>`;
  }).join('');
  renderWeekDayDetail(t);
}

function render(){
  const {rel,lanc,filename,missingSource}=loadData();
  const t=todayISO(); const d=dateLocalFromISO(t);
  document.getElementById('todayPill').textContent=`${DIAS[d.getDay()]}, ${pad(d.getDate())} de ${MESES[d.getMonth()]}`;
  document.getElementById('heroSub').textContent=`Resumo operacional e financeiro de ${fmtDateISO(t)}`;
  document.getElementById('lastUpdate').innerHTML=`Base: <strong>${escapeHtml(filename||'dashboard')}</strong>`;
  const orcs=(rel&&rel.orcs)||[];
  const entregas=orcs.filter(o=>getPrevEntregaISO(o)===t && (!o.entregue || o.entregue===t)).sort((a,b)=>String(a.placa||'').localeCompare(String(b.placa||'')));
  const agendados=orcs.filter(o=>getAgendaISO(o)===t && !o.entregue).sort((a,b)=>String(a.placa||'').localeCompare(String(b.placa||'')));
  const receber=lanc.filter(l=>l.tipo==='entrada'&&l.data===t).sort((a,b)=>b.valor-a.valor);
  const pagar=lanc.filter(l=>l.tipo==='saida'&&l.data===t).sort((a,b)=>b.valor-a.valor);
  const receberPrev=receber.filter(l=>l.status!=='realizado').reduce((s,l)=>s+l.valor,0);
  const pagarPrev=pagar.filter(l=>l.status!=='realizado').reduce((s,l)=>s+l.valor,0);
  const receberTotal=receber.reduce((s,l)=>s+l.valor,0), pagarTotal=pagar.reduce((s,l)=>s+l.valor,0);
  document.getElementById('summaryGrid').innerHTML=`
    <div class="sum-card" style="--sc:var(--blue)"><div class="sum-label">Carros para entrega</div><div class="sum-value">${entregas.length}</div><div class="sum-sub">previstos para hoje</div></div>
    <div class="sum-card" style="--sc:var(--purple)"><div class="sum-label">Carros agendados</div><div class="sum-value">${agendados.length}</div><div class="sum-sub">agendamentos de hoje</div></div>
    <div class="sum-card" style="--sc:var(--green)"><div class="sum-label">Receber hoje</div><div class="sum-value">${fmtMoney(receberTotal)}</div><div class="sum-sub">${receber.length} lançamento(s)</div></div>
    <div class="sum-card" style="--sc:var(--red)"><div class="sum-label">Pagar hoje</div><div class="sum-value">${fmtMoney(pagarTotal)}</div><div class="sum-sub">${pagar.length} lançamento(s)</div></div>`;
  const alert=document.getElementById('cashAlert');
  if(missingSource){alert.className='alert-line error';alert.style.display='flex';alert.innerHTML='<div><strong>Dados não carregados</strong><br><span>Abra esta página pelo botão Hoje do dashboard após importar a planilha. Sem isso, os cards podem aparecer vazios.</span></div>';}else if(receberPrev||pagarPrev){alert.className='alert-line';alert.style.display='flex';alert.innerHTML=`<div><strong>Pendências financeiras de hoje</strong><br><span>Valores previstos para hoje que ainda não foram confirmados.</span></div><div class="money-mini">Receber: ${fmtMoney(receberPrev)} · Pagar: ${fmtMoney(pagarPrev)}</div>`;}else{alert.className='alert-line';alert.style.display='none';}
  setList('entregasList','cEntregas',entregas,'Nenhuma entrega','Não há carros com entrega prevista para hoje.',o=>carItem(o,'entrega'));
  setList('agendadosList','cAgendados',agendados,'Nenhum agendamento','Não há carros agendados para hoje.',o=>carItem(o,'agenda'));
  setList('receberList','cReceber',receber,'Nada para receber','Não há pagamentos com data de hoje.',moneyItem);
  setList('pagarList','cPagar',pagar,'Nada para pagar','Não há pagamentos a fazer com data de hoje.',moneyItem);
  renderWeek(rel,lanc,t);
}
render();
</script>

<script>
// PR14: ponte de persistência entre páginas.
// Evita que os dados se percam ao navegar por Relatórios/Financeiro/Produção/Compras.
(function(){
  const KEYS=['melorelatorio','melofluxocaixa','melohoje','melooperacional'];
  function getRaw(storage,key){try{return storage.getItem(key)||'';}catch(e){return '';}}
  function setRaw(storage,key,value){try{if(value)storage.setItem(key,value);return true;}catch(e){console.warn('Falha ao preservar dados em storage:',key,e);return false;}}
  function bestRaw(key){return getRaw(sessionStorage,key)||getRaw(localStorage,key);}
  function preserveMeloData(){
    KEYS.forEach(key=>{
      const raw=bestRaw(key);
      if(!raw)return;
      if(!getRaw(sessionStorage,key))setRaw(sessionStorage,key,raw);
      if(!getRaw(localStorage,key))setRaw(localStorage,key,raw);
    });
  }
  window.preserveMeloData=preserveMeloData;
  document.addEventListener('DOMContentLoaded',()=>{
    preserveMeloData();
    document.querySelectorAll('a.app-tab[href]').forEach(a=>{
      a.addEventListener('click',()=>preserveMeloData(),{capture:true});
    });
  });
  window.addEventListener('pagehide',preserveMeloData);
})();
</script>
