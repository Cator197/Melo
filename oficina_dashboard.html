<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melo Reparos — Painel</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f0f4f8;--surface:#fff;--surface2:#f7f9fc;--border:#dde3ec;
  --blue:#1a56db;--blue-light:#e8f0fd;--blue-mid:#3b6fd4;
  --yellow:#f5a800;--yellow-lt:#fff8e6;
  --green:#16a34a;--green-lt:#dcfce7;
  --red:#dc2626;--red-lt:#fee2e2;
  --orange:#ea580c;--orange-lt:#ffedd5;
  --purple:#7c3aed;--purple-lt:#ede9fe;
  --teal:#0d9488;--teal-lt:#ccfbf1;
  --pink:#db2777;--pink-lt:#fce7f3;
  --text:#0f1b2d;--text-muted:#5a6a7e;--text-dim:#94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── HEADER ── */
header{background:var(--blue);padding:0 24px;display:flex;align-items:center;
  justify-content:space-between;height:62px;position:sticky;top:0;z-index:200;
  box-shadow:0 2px 12px rgba(26,86,219,.25);}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;
  letter-spacing:3px;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:10px;}
.logo-accent{color:var(--yellow);}
.logo-bar{width:3px;height:22px;background:var(--yellow);border-radius:2px;}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.last-update{font-size:12px;color:rgba(255,255,255,.65);}
.last-update strong{color:#fff;}

.hbtn{border:none;padding:8px 15px;font-family:'Barlow Condensed',sans-serif;font-weight:800;
  font-size:13px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;border-radius:5px;
  display:flex;align-items:center;gap:6px;transition:background .15s,transform .1s;
  box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap;}
.hbtn svg{width:14px;height:14px;flex-shrink:0;}
.hbtn-yellow{background:var(--yellow);color:#000;}
.hbtn-yellow:hover{background:#ffc233;transform:translateY(-1px);}
.hbtn-outline{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);}
.hbtn-outline:hover{background:rgba(255,255,255,.22);transform:translateY(-1px);}
.hbtn-red{background:#ef4444;color:#fff;}
.hbtn-red:hover{background:#dc2626;transform:translateY(-1px);}
.btn-upload-wrap{position:relative;}
.btn-upload-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;z-index:2;}
.btn-upload-wrap .hbtn{pointer-events:none;}

/* ── BARRA DE BUSCA/FILTRO ── */
#searchBar{display:none;background:var(--blue-light);border-bottom:2px solid #c7d8f8;
  padding:10px 24px;gap:10px;flex-wrap:wrap;align-items:center;}
#searchBar.visible{display:flex;}
.sb-group{display:flex;align-items:center;gap:8px;}
.sb-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--blue);white-space:nowrap;}
.sb-input{background:#fff;border:1.5px solid #c7d8f8;border-radius:6px;padding:7px 12px;
  font-family:'Barlow',sans-serif;font-size:13px;color:var(--text);outline:none;min-width:200px;}
.sb-input:focus{border-color:var(--blue);}
.sb-select{background:#fff;border:1.5px solid #c7d8f8;border-radius:6px;padding:7px 12px;
  font-family:'Barlow',sans-serif;font-size:13px;color:var(--text);outline:none;cursor:pointer;}
.sb-select:focus{border-color:var(--blue);}
.sb-divider{width:1px;height:28px;background:#c7d8f8;}
.filter-badge{background:var(--blue);color:#fff;font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:20px;display:none;}
.filter-badge.show{display:inline-flex;align-items:center;gap:5px;}

/* ── SPLASH ── */
#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:calc(100vh - 62px);gap:24px;padding:40px;}
.splash-icon{font-size:64px;}
.splash-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:32px;
  letter-spacing:3px;text-transform:uppercase;color:var(--blue);}
.splash-sub{color:var(--text-muted);font-size:15px;text-align:center;max-width:400px;line-height:1.6;}
.splash-drop{border:2px dashed var(--border);border-radius:16px;padding:36px 60px;
  display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--surface);
  cursor:pointer;transition:border-color .2s,background .2s;position:relative;}
.splash-drop:hover{border-color:var(--blue);background:var(--blue-light);}
.splash-drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.sdrop-icon{font-size:34px;}
.sdrop-text{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;
  letter-spacing:2px;text-transform:uppercase;color:var(--blue);}
.sdrop-hint{font-size:12px;color:var(--text-muted);}

/* ── LOADING ── */
#loading{display:none;flex-direction:column;align-items:center;justify-content:center;
  min-height:calc(100vh - 62px);gap:16px;}
.spinner{width:44px;height:44px;border:4px solid var(--border);
  border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;
  letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);}
.app-notice{display:none;max-width:900px;margin:14px auto 0;background:var(--yellow-lt);border:1px solid #fde68a;border-left:4px solid var(--yellow);border-radius:10px;padding:12px 16px;color:#7c2d12;font-size:13px;line-height:1.45;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.app-notice strong{font-family:'Barlow Condensed';font-size:16px;letter-spacing:1px;text-transform:uppercase;color:#92400e;display:block;margin-bottom:2px;}
.app-notice.error{background:var(--red-lt);border-color:#fecaca;border-left-color:var(--red);color:#7f1d1d;}
.app-notice.error strong{color:#991b1b;}
.app-notice.success{background:var(--green-lt);border-color:#bbf7d0;border-left-color:var(--green);color:#14532d;}
.app-notice.success strong{color:#166534;}

#content{display:none;}
main{padding:24px 28px;display:flex;flex-direction:column;gap:32px;max-width:1600px;margin:0 auto;}

/* ── SECTION ── */
.sec-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.sec-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;
  letter-spacing:2.5px;text-transform:uppercase;color:var(--blue);}
.sec-badge{background:var(--blue-light);border:1px solid #c7d8f8;color:var(--blue-mid);
  font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;}
.sec-line{flex:1;height:1px;background:var(--border);}
.sub-label{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.sub-label span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);}
.sub-label div{flex:1;height:1px;background:var(--border);}

/* ── STATS ── */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:16px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.stat-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.stat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);}
.stat-value{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:34px;line-height:1;}

/* ── FILA ── */
.fila-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
.fila-col{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.fila-col-hdr{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.fila-col-hdr .col-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;}
.col-peca  .fila-col-hdr{border-top:3px solid var(--red);}
.col-agendar .fila-col-hdr{border-top:3px solid var(--orange);}
.col-agend .fila-col-hdr{border-top:3px solid var(--blue);}
.col-peca  .col-title{color:var(--red);}
.col-agendar .col-title{color:var(--orange);}
.col-agend .col-title{color:var(--blue);}
.col-count{background:var(--surface2);border:1px solid var(--border);border-radius:50%;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-muted);}
.fila-cards{padding:10px;display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;}
.car-card{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;transition:border-color .15s;}
.car-card:hover{border-color:var(--blue);}
.car-card .plate{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;letter-spacing:2px;color:var(--blue);}
.car-card .car-model{font-size:12px;color:var(--text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.car-card .car-owner{font-size:11px;color:var(--text-muted);margin-top:2px;}
.car-card .card-tags{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px;}
.tag-ok{background:var(--green-lt);color:var(--green);}
.tag-warn{background:var(--yellow-lt);color:#a16207;}
.tag-err{background:var(--red-lt);color:var(--red);}
.tag-info{background:var(--blue-light);color:var(--blue);}

/* ── ETAPAS ── */
.etapas-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
.etapa-col{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.etapa-col-hdr{padding:10px 12px;text-align:center;border-bottom:1px solid var(--border);}
.etapa-col-hdr .col-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase;}
.e-desm{border-top:3px solid var(--pink);} .e-funi{border-top:3px solid var(--orange);}
.e-prep{border-top:3px solid var(--yellow);} .e-pint{border-top:3px solid var(--blue);}
.e-mont{border-top:3px solid var(--purple);} .e-poli{border-top:3px solid var(--teal);}
.e-desm .col-title{color:var(--pink);} .e-funi .col-title{color:var(--orange);}
.e-prep .col-title{color:#a16207;} .e-pint .col-title{color:var(--blue);}
.e-mont .col-title{color:var(--purple);} .e-poli .col-title{color:var(--teal);}
.etapa-cards{padding:10px;display:flex;flex-direction:column;gap:8px;}
.etapa-card{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;transition:border-color .15s;}
.etapa-card:hover{border-color:var(--blue);}
.etapa-card .plate{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;letter-spacing:2px;color:var(--blue);}
.etapa-card .car-model{font-size:12px;color:var(--text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.etapa-card .car-owner{font-size:11px;color:var(--text-muted);margin-top:2px;}
.etapa-card .entrega-row{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:11px;
  font-weight:600;color:var(--blue-mid);background:var(--blue-light);padding:3px 8px;border-radius:4px;width:fit-content;}
.empty-col{padding:18px 10px;text-align:center;color:var(--text-dim);font-size:12px;}

/* ── ENTREGUES ── */
.entregues-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.entregue-card{background:var(--green-lt);border:1px solid #bbf7d0;border-radius:8px;
  padding:10px 14px;display:flex;align-items:center;gap:10px;}
.entregue-check{width:22px;height:22px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.entregue-card .plate{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;letter-spacing:2px;color:var(--green);}
.entregue-card .car-model{font-size:12px;color:var(--text-muted);}
.entregue-card .data-entrega{font-size:11px;color:#166534;margin-top:1px;}

/* ── TABELAS GERAIS ── */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.table-toolbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface2);
  border-bottom:1px solid var(--border);flex-wrap:wrap;}
.tt-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);}
.tt-input{background:#fff;border:1.5px solid var(--border);border-radius:5px;padding:5px 10px;
  font-family:'Barlow',sans-serif;font-size:12px;color:var(--text);outline:none;}
.tt-input:focus{border-color:var(--blue);}
.tt-select{background:#fff;border:1.5px solid var(--border);border-radius:5px;padding:5px 10px;
  font-family:'Barlow',sans-serif;font-size:12px;color:var(--text);outline:none;cursor:pointer;}
.tt-select:focus{border-color:var(--blue);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:var(--blue);}
thead th{padding:10px 14px;text-align:left;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.85);white-space:nowrap;cursor:pointer;user-select:none;}
thead th:hover{background:#2563eb;}
thead th .sort-icon{margin-left:4px;opacity:.5;font-size:10px;}
thead th.sorted .sort-icon{opacity:1;}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--surface2);}
tbody td{padding:10px 14px;color:var(--text);vertical-align:middle;}
.td-plate{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;letter-spacing:2px;color:var(--blue);white-space:nowrap;}
.td-valor{font-weight:600;white-space:nowrap;}
.td-center{text-align:center;}

/* ── LISTA GERAL (1 por linha) ── */
.lista-rows{display:flex;flex-direction:column;gap:10px;}
.vrow{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  display:grid;grid-template-columns:160px 1fr 1fr auto;gap:0;
  overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:border-color .15s,box-shadow .15s;}
.vrow:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(26,86,219,.1);}
.vrow-id{padding:14px 16px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;background:var(--surface2);}
.vrow-placa{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;letter-spacing:3px;color:var(--blue);line-height:1;}
.vrow-modelo{font-size:11px;color:var(--text);margin-top:3px;line-height:1.3;}
.vrow-cliente{font-size:11px;color:var(--text-muted);margin-top:2px;}
.vrow-info{padding:12px 16px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:5px;}
.vrow-pend{font-size:12px;line-height:1.4;}
.vrow-tipo{font-size:11px;color:var(--text-muted);}
.vrow-meta{padding:12px 16px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:6px;}
.vrow-meta-item{display:flex;align-items:center;gap:6px;font-size:12px;}
.vrow-meta-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);min-width:60px;}
.vrow-status{padding:12px 16px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:6px;}
.etapa-pill{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:5px;white-space:nowrap;}
.status-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text-muted);}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.status-dot.ok{background:var(--green);}
.status-dot.no{background:var(--red);}
.status-dot.par{background:var(--yellow);}

/* Lista toolbar avançada */
.lista-toolbar{display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:var(--surface2);border:1px solid var(--border);border-radius:10px 10px 0 0;
  flex-wrap:wrap;border-bottom:none;}
.lista-body{background:var(--surface);border:1px solid var(--border);border-top:none;
  border-radius:0 0 10px 10px;overflow:hidden;}

/* ── AGENDA ── */
.agenda-weeks{display:flex;flex-direction:column;gap:12px;}
.agenda-week{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);position:relative;}
.agenda-week.current{border-color:#b8cdf8;box-shadow:0 2px 10px rgba(26,86,219,.08);}
.agenda-week.current::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--blue);z-index:1;}
.agenda-week-hdr{padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.agenda-week.current .agenda-week-hdr{padding-top:12px;background:#f5f8ff;}
.agenda-week-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;letter-spacing:1.8px;text-transform:uppercase;color:var(--blue);line-height:1;}
.agenda-week-sub{font-size:11px;color:var(--text-muted);margin-top:3px;}
.agenda-week-badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;padding:3px 8px;border-radius:20px;background:var(--blue-light);border:1px solid #c7d8f8;color:var(--blue);white-space:nowrap;}
.agenda-week.current .agenda-week-badge{background:var(--blue);border-color:var(--blue);color:#fff;}
.agenda-week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;}
.agenda-dia{background:var(--surface);border-right:1px solid var(--border);min-height:118px;display:flex;flex-direction:column;}
.agenda-dia:last-child{border-right:none;}
.agenda-dia-hdr{padding:7px 8px;background:#fbfcfe;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:42px;}
.agenda-dia-head-left{display:flex;align-items:baseline;gap:6px;min-width:0;}
.agenda-dia-dow{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1.2px;color:var(--blue);white-space:nowrap;}
.agenda-dia-data{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;letter-spacing:.5px;color:var(--text);line-height:1;}
.agenda-dia-mes{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);white-space:nowrap;}
.agenda-dia-count{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;color:var(--blue);background:var(--blue-light);border:1px solid #c7d8f8;border-radius:20px;min-width:23px;height:21px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.agenda-dia.today .agenda-dia-hdr{background:var(--green-lt);}
.agenda-dia.today .agenda-dia-dow,.agenda-dia.today .agenda-dia-count{color:var(--green);}
.agenda-dia.today .agenda-dia-count{background:#fff;border-color:#bbf7d0;}
.agenda-dia.overdue .agenda-dia-hdr{background:var(--red-lt);}
.agenda-dia.overdue .agenda-dia-dow,.agenda-dia.overdue .agenda-dia-count{color:var(--red);}
.agenda-dia.soon .agenda-dia-hdr{background:var(--orange-lt);}
.agenda-dia.soon .agenda-dia-dow,.agenda-dia.soon .agenda-dia-count{color:var(--orange);}
.agenda-dia.empty{background:#fbfcfe;}
.agenda-dia-body{display:flex;flex-direction:column;gap:5px;padding:7px;flex:1;}
.agenda-item{padding:6px 7px;border:1px solid var(--border);border-radius:6px;background:#fff;display:flex;flex-direction:column;gap:3px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.agenda-item-main{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}

  .print-cal-plate{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:10.5px;letter-spacing:1.4px;color:#1a56db;}

.stage-time-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}

.stage-time-item{display:grid;grid-template-columns:150px minmax(160px,220px) 1fr auto;gap:10px;align-items:center;border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:12px;}

<script>
// ══════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════
const ETAPAS_OFICINA=['Desmontagem','Funilaria','Preparação','Pintura','Montagem','Polimento'];
const ETAPA_CSS={Desmontagem:'e-desm',Funilaria:'e-funi','Preparação':'e-prep',Pintura:'e-pint',Montagem:'e-mont',Polimento:'e-poli'};
const ETAPA_ICONS={Desmontagem:'🔩',Funilaria:'🔨','Preparação':'🧪',Pintura:'🎨',Montagem:'⚙️',Polimento:'✨'};
const ETAPA_COLORS={
  'Aguardando peça':['var(--red-lt)','var(--red)'],
  'Agendar':['var(--orange-lt)','var(--orange)'],
  'Agendado':['var(--blue-light)','var(--blue)'],
  Desmontagem:['var(--pink-lt)','var(--pink)'],
  Funilaria:['var(--orange-lt)','var(--orange)'],
  'Preparação':['var(--yellow-lt)','#a16207'],
  Pintura:['var(--blue-light)','var(--blue)'],
  Montagem:['var(--purple-lt)','var(--purple)'],
  Polimento:['var(--teal-lt)','var(--teal)'],
};
const DIAS_PT=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES_PT=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function pad2(n){return String(n).padStart(2,'0');}
function excelSerialToLocalDate(v){
  if(typeof v!=='number'||!isFinite(v))return null;
  if(window.XLSX&&XLSX.SSF&&XLSX.SSF.parse_date_code){
    const d=XLSX.SSF.parse_date_code(v);
    if(d&&d.y&&d.m&&d.d)return new Date(Number(d.y),Number(d.m)-1,Number(d.d));
  }
  const d=new Date(1899,11,30);
  d.setDate(d.getDate()+Math.floor(v));
  return d;
}
function localDateISO(d){return d&&!isNaN(d)?`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`:'';}
function fmtDate(v){
  const d=parseToDate(v);
  if(d)return d.toLocaleDateString('pt-BR');
  if(!v&&v!==0)return'—';
  const s=String(v).trim();
  return s&&s!=='undefined'?s:'—';
}
function parseToDate(v){
  if(!v&&v!==0)return null;
  if(typeof v==='number')return excelSerialToLocalDate(v);
  if(v instanceof Date)return isNaN(v)?null:new Date(v.getFullYear(),v.getMonth(),v.getDate());
  const s=String(v).trim();if(!s||s==='—')return null;
  let p=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(p){const yr=Number(p[3].length===2?'20'+p[3]:p[3]);return new Date(yr,Number(p[2])-1,Number(p[1]));}
  p=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(p)return new Date(Number(p[1]),Number(p[2])-1,Number(p[3]));
  const d=new Date(s);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function hydrateVehicleDates(o){
  if(!o||typeof o!=='object')return o;
  o.entradaDate=parseToDate(o.entradaDate)||parseToDate(o.entrada)||null;
  o.entregaDate=parseToDate(o.entregaDate)||parseToDate(o.entrega)||null;
  o.prevEntregaDate=parseToDate(o.prevEntregaDate)||parseToDate(o.prevEntrega)||null;
  o.etapaDesdeDate=parseToDate(o.etapaDesdeDate)||parseToDate(o.etapaDesdeISO)||parseToDate(o.etapaDesde)||null;
  o.etapaFimDate=parseToDate(o.etapaFimDate)||parseToDate(o.etapaFimISO)||parseToDate(o.etapaFim)||null;
  o.diasNaEtapa=o.etapaDesdeDate?Math.max(0,Math.round((_todayStart()-o.etapaDesdeDate)/864e5)):null;
  return o;
}
function hydrateOperationalActive(active){
  Object.values(active||{}).forEach(hydrateVehicleDates);
  return active||{};
}
function isDateInMonth(v,year,month){
  const d=parseToDate(v);if(!d)return false;
  return d.getFullYear()===year&&d.getMonth()+1===month;
}
function escapeHtml(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(v){return escapeHtml(v).replace(/`/g,'&#96;');}
function showAppNotice(title,msg,type='warn'){
  const el=document.getElementById('appNotice');
  if(!el)return;
  el.className='app-notice '+(type==='error'?'error':type==='success'?'success':'');
  el.innerHTML=`<strong>${escapeHtml(title)}</strong><span>${escapeHtml(msg)}</span>`;
  el.style.display='block';
}
function clearAppNotice(){const el=document.getElementById('appNotice');if(el){el.style.display='none';el.innerHTML='';}}
function safeStorageSet(key,value){
  try{
    const json=JSON.stringify(value);
    try{sessionStorage.setItem(key,json);}catch(e){console.warn('sessionStorage indisponível para',key,e);}
    try{localStorage.setItem(key,json);}catch(e){console.warn('localStorage indisponível para',key,e);}
    return true;
  }catch(err){
    console.error('Erro ao salvar dados para abrir página auxiliar:',err);
    showAppNotice('Não foi possível salvar os dados','Os dados não puderam ser preparados. Tente carregar a planilha novamente.', 'error');
    return false;
  }
}
function str(v){if(v===undefined||v===null)return'';return String(v).trim();}
function titleCase(s){return str(s).replace(/\w\S*/g,t=>t.charAt(0).toUpperCase()+t.slice(1).toLowerCase());}
function fmtMoney(v){
  if(!v&&v!==0)return'A cotar';
  const n=parseFloat(v);if(isNaN(n))return'A cotar';
  return'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function isDelivered(v){return v!==undefined&&v!==null&&v!=='';}
function pecasStatus(o){
  if(o.pecasTotal===0)return['ok','Sem peças'];
  if(o.pecasEntregues===o.pecasTotal)return['ok','Peças entregues'];
  if(o.pecasEntregues===0)return['no','Peças pendentes'];
  return['par',`Peças ${o.pecasEntregues}/${o.pecasTotal}`];
}

// ══════════════════════════════════════════════════════
// ESTADO GLOBAL
// ══════════════════════════════════════════════════════
let G={active:{},entregues:[],compras:{},mesNome:'',filename:''};
window._rawFluxoCaixa=null;
let G_filter={search:'',orcId:'',etapa:''};

// ══════════════════════════════════════════════════════
// LEITURA
// ══════════════════════════════════════════════════════
function handleFile(input){
  const file=input.files[0];if(!file)return;
  clearAppNotice();
  document.getElementById('splash').style.display='none';
  document.getElementById('loading').style.display='flex';
  document.getElementById('content').style.display='none';
  const reader=new FileReader();
  reader.onload=e=>{
    try{const wb=XLSX.read(e.target.result,{type:'array',cellDates:false});processWB(wb,file.name);}
    catch(err){
      document.getElementById('loading').style.display='none';
      document.getElementById('splash').style.display='flex';
      showAppNotice('Erro ao ler a planilha','Verifique se o arquivo está no formato .xlsx/.xlsm e tente novamente. Detalhe: '+err.message,'error');
    }
  };
  reader.readAsArrayBuffer(file);
}
document.addEventListener('DOMContentLoaded',()=>{
  const splash=document.getElementById('splash');
  splash.addEventListener('dragover',e=>e.preventDefault());
  splash.addEventListener('drop',e=>{
    e.preventDefault();
    const f=e.dataTransfer.files[0];
    if(f){const i=document.getElementById('fileInput');i.files=e.dataTransfer.files;handleFile(i);}
  });
});

function _tdComp(v){
  const d=parseToDate(v);
  return d?localDateISO(d):null;
}
function processWB(wb,filename){
  const now=new Date();
  const curYear=now.getFullYear(),curMonth=now.getMonth()+1;
  const mesNome=now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const wsOrc=wb.Sheets['BD_ORCAMENTOS'],wsItens=wb.Sheets['BD_ITENS_ORCAMENTO'];
  if(!wsOrc||!wsItens){
    document.getElementById('loading').style.display='none';
    document.getElementById('splash').style.display='flex';
    showAppNotice('Planilha inválida','Não encontrei as abas obrigatórias BD_ORCAMENTOS e/ou BD_ITENS_ORCAMENTO. Confirme se carregou a planilha correta.','error');
    return;
  }
  const rowsOrc=XLSX.utils.sheet_to_json(wsOrc,{header:1,defval:''});
  const rowsItens=XLSX.utils.sheet_to_json(wsItens,{header:1,defval:''});
  if(rowsOrc.length<=1){
    document.getElementById('loading').style.display='none';
    document.getElementById('splash').style.display='flex';
    showAppNotice('Nenhum orçamento encontrado','A aba BD_ORCAMENTOS existe, mas não possui linhas válidas para montar o painel.','error');
    return;
  }
  const active={};const entregues=[];

  for(let i=1;i<rowsOrc.length;i++){
    const r=rowsOrc[i];if(!r[0])continue;
    const orcId=r[0],entregueEm=r[20];
    const placa=str(r[2]).toUpperCase(),veiculo=str(r[3]).toUpperCase();
    const cor=titleCase(r[5]),tipo=str(r[6]),seguro=str(r[7]),cliente=titleCase(r[8])||'—';
    const status=str(r[9]),etapa=str(r[10]);
    const agenda=r[11],entregaRaw=r[13],coment=str(r[14]),tinta=str(r[16]).toLowerCase();
    const etapaTiming=getEtapaAtualTimingFromRow(r, etapa);
    const etapaDesdeRaw=etapaTiming.inicioRaw;
    const etapaDesdeDate=etapaTiming.inicioDate;
    const etapaFimRaw=etapaTiming.fimRaw;
    const etapaFimDate=etapaTiming.fimDate;
    const diasNaEtapa=etapaDesdeDate?Math.max(0,Math.round((_todayStart()-etapaDesdeDate)/864e5)):null;
    if(!isDelivered(entregueEm)){
      active[orcId]={orcId,placa,veiculo,cor,tipo,seguro,cliente,status,etapa,
        agendamento:fmtDate(agenda),agendamentoISO:localDateISO(parseToDate(agenda)),
        entrada:fmtDate(r[12]),entradaISO:localDateISO(parseToDate(r[12])),entradaDate:parseToDate(r[12]),
        entrega:fmtDate(entregaRaw),prevEntrega:localDateISO(parseToDate(entregaRaw)),entregaISO:localDateISO(parseToDate(entregaRaw)),entregaDate:parseToDate(entregaRaw),
        etapaDesde:fmtDate(etapaDesdeRaw),etapaDesdeISO:localDateISO(etapaDesdeDate),etapaDesdeDate,diasNaEtapa,
        etapaFim:fmtDate(etapaFimRaw),etapaFimISO:localDateISO(etapaFimDate),etapaFimDate,
        comentario:coment,tinta,pecasTotal:0,pecasEntregues:0};
    } else if(isDateInMonth(entregueEm,curYear,curMonth)){
      entregues.push({placa,veiculo,cliente,data:fmtDate(entregueEm)});
    }
  }

  const compras={};
  for(let i=1;i<rowsItens.length;i++){
    const r=rowsItens[i];if(!r[0])continue;
    const orcId=r[0];if(!active[orcId])continue;
    const descricao=str(r[2]),troca=str(r[3]).toUpperCase(),statusP=str(r[4]);
    const fornecedor=str(r[5]),previsto=r[6],entregueP=r[7],custo=r[8];
    const fornUp=fornecedor.toUpperCase();
    if(troca==='SIM'){
      active[orcId].pecasTotal++;
      if(isDelivered(entregueP))active[orcId].pecasEntregues++;
    }
    if(troca==='SIM'&&!isDelivered(entregueP)&&fornUp!=='SEGURADORA'&&fornUp!=='CLIENTE'){
      const forn=(fornUp==='OFICINA'||!fornecedor)?'A definir':fornecedor;
      if(!compras[orcId])compras[orcId]=[];
      compras[orcId].push({descricao,status:statusP,fornecedor:forn,previsto:fmtDate(previsto),custo:fmtMoney(custo)});
    }
  }

  G={active,entregues,compras,mesNome,filename};
  // Store raw data for relatorio
  window._rawRelatorio=null;
  // Read Compras sheet for relatorio
  let _comprasRaw=[];
  const wsComp=wb.Sheets['Compras'];
  if(wsComp){
    const rowsComp=XLSX.utils.sheet_to_json(wsComp,{header:1,defval:''});
    for(let i=1;i<rowsComp.length;i++){
      const r=rowsComp[i];if(!r[0])continue;
      _comprasRaw.push({data:_tdComp(r[1]),total:parseFloat(r[8])||0});
    }
  }
  G_filter={search:'',orcId:'',etapa:''};
  // Build raw for relatorio page
  window._rawRelatorio=_buildRawForRelatorio(rowsOrc,rowsItens,_comprasRaw);
  window._rawFluxoCaixa=_buildRawForFluxoCaixa(wb,filename);

  // Popula selects
  const selV=document.getElementById('vehicleSelect');
  selV.innerHTML='<option value="">Todos</option>';
  Object.values(active).sort((a,b)=>a.placa.localeCompare(b.placa)).forEach(o=>{
    selV.innerHTML+=`<option value="${escapeAttr(o.orcId)}">${escapeHtml(o.placa)} — ${escapeHtml(o.veiculo)}</option>`;
  });

  const etapasUnicas=[...new Set(Object.values(active).map(o=>o.etapa))].sort();
  const selE=document.getElementById('etapaSelect');
  selE.innerHTML='<option value="">Todas</option>';
  etapasUnicas.forEach(e=>selE.innerHTML+=`<option value="${escapeAttr(e)}">${escapeHtml(e)}</option>`);

  const now2=new Date();
  document.getElementById('lastUpdate').innerHTML=
    `<strong>${escapeHtml(filename)}</strong> · ${now2.toLocaleDateString('pt-BR')} ${now2.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;

  document.getElementById('searchBar').classList.add('visible');
  document.getElementById('hdrControls').style.display='flex';
  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='block';

  renderAll(Object.values(active));
  buildPrint();
  window.scrollTo(0,0);
}

// ══════════════════════════════════════════════════════
// FILTRO GLOBAL
// ══════════════════════════════════════════════════════
function applyGlobalFilter(){
  const search=document.getElementById('globalSearch').value.toLowerCase().trim();
  const orcId=document.getElementById('vehicleSelect').value;
  const etapa=document.getElementById('etapaSelect').value;
  G_filter={search,orcId,etapa};

  const hasFilter=search||orcId||etapa;
  document.getElementById('btnClearFilter').style.display=hasFilter?'flex':'none';
  document.getElementById('filterBadge').classList.toggle('show',!!hasFilter);

  let list=Object.values(G.active);
  if(orcId) list=list.filter(o=>String(o.orcId)===orcId);
  else if(search) list=list.filter(o=>o.placa.toLowerCase().includes(search)||o.cliente.toLowerCase().includes(search));
  if(etapa) list=list.filter(o=>o.etapa===etapa);

  renderAll(list);
}

function clearGlobalFilter(){
  document.getElementById('globalSearch').value='';
  document.getElementById('vehicleSelect').value='';
  document.getElementById('etapaSelect').value='';
  G_filter={search:'',orcId:'',etapa:''};
  document.getElementById('btnClearFilter').style.display='none';
  document.getElementById('filterBadge').classList.remove('show');
  renderAll(Object.values(G.active));
}


function renderOverviewIntro(list){
  const el=document.getElementById('overviewIntro');if(!el)return;
  el.innerHTML=`<div class="overview-intro">
    <div>
      <div class="overview-kicker">Visão Geral</div>
      <div class="overview-title">Painel resumido da oficina</div>
      <div class="overview-sub">Esta tela agora mostra somente indicadores, alertas e atalhos. Use os cards de áreas para abrir detalhes de produção, compras, agenda, tinta e lista geral quando precisar aprofundar.</div>
    </div>
    <div class="overview-status">📄 ${escapeHtml(G.filename||'Planilha carregada')}</div>
  </div>`;
}

function renderAreasOverview(list,filaPeca,filaAgendar,filaAgend,oficina,totCompras){
  const el=document.getElementById('areasSection');if(!el)return;
  const totProducao=ETAPAS_OFICINA.reduce((s,e)=>s+(oficina[e]||[]).length,0);
  const semPrevisao=list.filter(o=>!parseToDate(o.entrega)||o.entrega==='—').length;
  const agendaCritica=filaAgendar.length+semPrevisao;
  const tintaComprar=list.filter(o=>o.tinta==='comprar').length;
  const atrasados=list.filter(o=>{const d=parseToDate(o.entrega);return d&&d<_todayStart();}).length;
  el.innerHTML=`<div class="areas-panel">
    <div class="areas-hdr">
      <div><div class="areas-title">Áreas detalhadas</div><div class="areas-sub">O dashboard ficou mais limpo. Abra somente a área que precisar analisar agora.</div></div>
      <span class="sec-badge">Separação operacional</span>
    </div>
    <div class="areas-grid">
      ${_areaCard('Produção',totProducao,`${atrasados} atrasado(s) · ${filaPeca.length} aguardando peça`,'var(--orange)','producao.html',atrasados||filaPeca.length?'warn':'')}
      ${_areaCard('Compras',totCompras,`${filaPeca.length} carro(s) podem depender de peça`,'var(--red)','compras.html',totCompras?'critical':'')}
      ${_areaCard('Agenda',agendaCritica,`${filaAgend.length} agendado(s) · ${semPrevisao} sem previsão`,'var(--blue)','agendaSection',agendaCritica?'warn':'')}
      ${_areaCard('Tinta',tintaComprar,`${list.length-tintaComprar} veículo(s) com tinta OK`,'var(--purple)','tintaSection',tintaComprar?'warn':'')}
      ${_areaCard('Lista geral',list.length,'Busca e ordenação de todos os veículos ativos','var(--teal)','listaSection','')}
    </div>
  </div>`;
}
function _areaCard(label,value,desc,color,target,state){
  const isPage=String(target||'').endsWith('.html');
  const action=isPage?`openOperationalPage('${target}')`:`toggleDetailSection('${target}')`;
  return `<div class="area-card ${state||''}" style="--ac:${color}">
    <div class="area-label">${escapeHtml(label)}</div>
    <div class="area-value">${value}</div>
    <div class="area-desc">${escapeHtml(desc)}</div>
    <button class="area-btn" onclick="${action}">Ver detalhes</button>
  </div>`;
}
function saveOperationalSnapshot(){
  try{
    if(!G||!G.active)return false;
    const payload={
      active:G.active||{},
      entregues:G.entregues||[],
      compras:G.compras||{},
      mesNome:G.mesNome||'',
      filename:G.filename||'',
      geradoEm:_hojeISOlocal()
    };
    return safeStorageSet('melooperacional',payload);
  }catch(e){return false;}
}

function saveAllDataSnapshots(){
  const okOper=saveOperationalSnapshot();
  let okRel=true,okFlux=true,okHoje=true;
  if(window._rawRelatorio&&Array.isArray(window._rawRelatorio.orcs)&&window._rawRelatorio.orcs.length){
    okRel=safeStorageSet('melorelatorio',window._rawRelatorio);
    okHoje=safeStorageSet('melohoje',{
      relatorio:window._rawRelatorio,
      fluxo:window._rawFluxoCaixa||null,
      geradoEm:_hojeISOlocal(),
      filename:G&&G.filename?G.filename:''
    });
  }
  if(window._rawFluxoCaixa&&Array.isArray(window._rawFluxoCaixa.lancamentosRows)&&window._rawFluxoCaixa.lancamentosRows.length){
    okFlux=safeStorageSet('melofluxocaixa',window._rawFluxoCaixa);
  }
  return !!(okOper&&okRel&&okFlux&&okHoje);
}
function openOperationalPage(page,sameTab=false){
  if(!saveAllDataSnapshots()){
    showAppNotice('Não foi possível abrir a área','Recarregue a planilha e tente novamente.','error');
    return;
  }
  if(sameTab){ window.location.href=page; } else { window.open(page,'_blank'); }
}
function toggleDetailSection(id){
  const el=document.getElementById(id);if(!el)return;
  const isHidden=el.classList.contains('detail-hidden');
  el.classList.toggle('detail-hidden',!isHidden);
  el.classList.toggle('detail-visible',isHidden);
  if(isHidden){
    ensureDetailNote(el,id);
    el.scrollIntoView({behavior:'smooth',block:'start'});
  }
}
function ensureDetailNote(el,id){
  if(el.querySelector('.detail-note'))return;
  const note=document.createElement('div');
  note.className='detail-note';
  note.innerHTML=`<span>Área detalhada aberta. O dashboard principal permanece resumido para evitar excesso de informação.</span><button onclick="hideDetailSection('${id}')">Ocultar</button>`;
  el.prepend(note);
}
function hideDetailSection(id){
  const el=document.getElementById(id);if(!el)return;
  el.classList.add('detail-hidden');el.classList.remove('detail-visible');
  const areas=document.getElementById('areasSection');if(areas)areas.scrollIntoView({behavior:'smooth',block:'start'});
}
function resetDetailSections(){
  ['kanbanSection','comprasSection','listaSection','agendaSection','tintaSection'].forEach(id=>{const el=document.getElementById(id);if(el){el.classList.add('detail-hidden');el.classList.remove('detail-visible');}});
}

// ══════════════════════════════════════════════════════
// RENDER PRINCIPAL

function renderAll(list){
  const filaPeca=list.filter(o=>o.etapa==='Aguardando peça');
  const filaAgendar=list.filter(o=>o.etapa==='Agendar');
  const filaAgend=list.filter(o=>o.etapa==='Agendado');
  const oficina={};
  ETAPAS_OFICINA.forEach(e=>oficina[e]=list.filter(o=>o.etapa===e));
  const totOficina=ETAPAS_OFICINA.reduce((s,e)=>s+oficina[e].length,0);
  const totFila=filaPeca.length+filaAgendar.length+filaAgend.length;
  const totCompras=Object.entries(G.compras).filter(([id])=>list.find(o=>String(o.orcId)===id)).reduce((s,[,v])=>s+v.length,0);
  saveAllDataSnapshots();

  renderOverviewIntro(list);
  resetDetailSections();

  // Stats
  document.getElementById('statsBar').innerHTML=`
    <div class="stat-card"><div class="stat-icon" style="background:var(--blue-light)">🚗</div>
      <div><div class="stat-label">Na Oficina</div><div class="stat-value" style="color:var(--blue)">${totOficina}</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:var(--yellow-lt)">📋</div>
      <div><div class="stat-label">Na Fila</div><div class="stat-value" style="color:#a16207">${totFila}</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:var(--red-lt)">🔧</div>
      <div><div class="stat-label">Itens a Comprar</div><div class="stat-value" style="color:var(--red)">${totCompras}</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:var(--green-lt)">✅</div>
      <div><div class="stat-label">Entregues (mês)</div><div class="stat-value" style="color:var(--green)">${G.entregues.length}</div></div></div>`;

  renderStageTimeOverview(list);
  renderAttention(list,filaPeca,filaAgendar,filaAgend,totCompras);
  renderManagementMetrics(list,oficina,filaPeca,filaAgendar,filaAgend,totCompras);
  renderAreasOverview(list,filaPeca,filaAgendar,filaAgend,oficina,totCompras);
  renderKanban(filaPeca,filaAgendar,filaAgend,oficina,totFila,totOficina);
  renderCompras(list);
  renderLista(list);
  renderAgenda(list);
  renderTinta(list);
}


function _todayStart(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function _sameDay(a,b){a=parseToDate(a);b=parseToDate(b);return !!(a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate());}
function _shortVehicle(o){return `${o.placa||'—'} · ${o.veiculo||'—'}`;}
function _attItems(items, emptyText){
  if(!items.length)return `<div class="att-item">${escapeHtml(emptyText)}</div>`;
  return items.map(v=>`<div class="att-item" title="${escapeAttr(v)}">${escapeHtml(v)}</div>`).join('');
}
function _etapaKey(v){
  return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function getEtapaPrazoDias(etapa){
  const e=_etapaKey(etapa);
  if(e==='pintura'||e==='polimento'||e==='poliment')return 2;
  if(e==='desmontagem'||e==='preparacao'||e==='montagem')return 2;
  if(e==='funilaria')return 5;
  if(e==='aguardando peca')return 7;
  if(e==='agendar')return 4;
  return 7;
}
function getEtapaAtualTimingFromRow(row, etapa){
  const e=_etapaKey(etapa);
  const map={
    'desmontagem':{inicio:25,fim:26,label:'Desmontagem'},
    'funilaria':{inicio:27,fim:28,label:'Funilaria'},
    'preparacao':{inicio:29,fim:30,label:'Preparação'},
    'pintura':{inicio:31,fim:32,label:'Pintura'},
    'montagem':{inicio:33,fim:34,label:'Montagem'},
    'polimento':{inicio:35,fim:36,label:'Polimento'},
    'poliment':{inicio:35,fim:36,label:'Polimento'}
  };
  const cfg=map[e];
  if(!cfg)return {inicioRaw:null,fimRaw:null,inicioDate:null,fimDate:null,label:String(etapa||'').trim()};
  const inicioRaw=row[cfg.inicio];
  const fimRaw=row[cfg.fim];
  return {
    inicioRaw,
    fimRaw,
    inicioDate:parseToDate(inicioRaw),
    fimDate:parseToDate(fimRaw),
    label:cfg.label
  };
}
function getLongStageVehicles(list){
  return (list||[]).filter(o=>{
    if(!o||!o.etapaDesdeDate)return false;
    if(_etapaKey(o.etapa)==='agendado')return false;
    const dias=typeof o.diasNaEtapa==='number'?o.diasNaEtapa:Math.max(0,Math.round((_todayStart()-o.etapaDesdeDate)/864e5));
    return dias>=getEtapaPrazoDias(o.etapa);
  }).sort((a,b)=>(b.diasNaEtapa||0)-(a.diasNaEtapa||0));
}
function _longStageText(o){
  const dias=typeof o.diasNaEtapa==='number'?o.diasNaEtapa:0;
  return `${o.placa||'—'} · ${o.veiculo||'—'} · ${o.etapa||'—'} · ${dias}d`;
}
function _getFluxoHojeResumo(){
  const raw=window._rawFluxoCaixa;
  if(!raw||!Array.isArray(raw.lancamentosRows))return null;
  function norm(v){return String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
  function get(row,...names){
    const map={};Object.keys(row||{}).forEach(k=>map[norm(k)]=row[k]);
    for(const name of names){const key=norm(name);if(Object.prototype.hasOwnProperty.call(map,key))return map[key];}
    return '';
  }
  function money(v){
    if(typeof v==='number')return Math.abs(v)||0;
    const s=String(v||'').replace(/R\$|\s/g,'').replace(/\./g,'').replace(',', '.');
    return Math.abs(parseFloat(s))||0;
  }
  const today=_hojeISOlocal();
  const rows=raw.lancamentosRows.map((row,idx)=>{
    const tipo=norm(get(row,'Tipo')).includes('entrada')?'entrada':(norm(get(row,'Tipo')).includes('saida')?'saida':'');
    if(!tipo)return null;
    const statusRaw=norm(get(row,'Status'));
    if(statusRaw.includes('cancel'))return null;
    const status=(statusRaw.includes('real')||statusRaw.includes('pago')||statusRaw.includes('quitado'))?'realizado':'previsto';
    const dataPrev=_tdComp(get(row,'Data prevista','Data Prevista'));
    const dataReal=_tdComp(get(row,'Data realizada','Data Realizada'));
    const data=(status==='realizado'&&dataReal)?dataReal:dataPrev;
    if(data!==today)return null;
    const valorPrev=money(get(row,'Valor previsto (R$)','Valor previsto','Valor Previsto'));
    const valorReal=money(get(row,'Valor realizado (R$)','Valor realizado','Valor Realizado'));
    const valor=(status==='realizado'&&valorReal>0)?valorReal:valorPrev;
    if(!valor)return null;
    return {tipo,status,valor,desc:String(get(row,'Descrição','Descricao','Cliente / Fornecedor','Cliente','Fornecedor')||'Lançamento').trim()||'Lançamento'};
  }).filter(Boolean);
  return {
    entradas:rows.filter(r=>r.tipo==='entrada').reduce((s,r)=>s+r.valor,0),
    saidas:rows.filter(r=>r.tipo==='saida').reduce((s,r)=>s+r.valor,0),
    pendentes:rows.filter(r=>r.status!=='realizado'),
    total:rows.length
  };
}

    el.innerHTML=`<div class="stage-time-panel ok">
      <div class="stage-time-hdr">
        <div><div class="stage-time-title">✅ Tempo na etapa sob controle</div><div class="stage-time-sub">Nenhum veículo ultrapassou o limite definido para a etapa atual.</div></div>
        <div class="stage-time-total">0 alertas</div>
      </div>
    </div>`;
    return;
  }
  const maxDias=Math.max(...items.map(o=>Number(o.diasNaEtapa)||0));

      <div><div class="stage-time-title">⏱️ Veículos há muito tempo na etapa</div><div class="stage-time-sub">Alerta principal para carros parados acima do limite da etapa atual, calculado pelas colunas de início/fim de cada etapa.</div></div>

      </div>

        ${items.map(o=>{

            <div class="stage-time-days">${dias}d</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

function _daysBetweenDates(a,b){a=parseToDate(a);b=parseToDate(b);if(!a||!b)return null;return Math.max(0,Math.round((b-a)/864e5));}
function _addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function _metricCard(label,value,sub,color,extra='',state=''){
  return `<div class="metric-card ${state}" style="--mc:${color||'var(--blue)'}"><div class="metric-label">${escapeHtml(label)}</div><div class="metric-value">${value}</div><div class="metric-sub">${sub}</div>${extra}</div>`;
}
function _topEtapa(oficina){
  let top={nome:'—',qtd:0};
  Object.entries(oficina||{}).forEach(([nome,arr])=>{if((arr||[]).length>top.qtd)top={nome,qtd:arr.length};});
  return top;
}
function _getFluxoSemanaResumo(){
  const raw=window._rawFluxoCaixa;
  if(!raw||!Array.isArray(raw.lancamentosRows))return null;
  function norm(v){return String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
  function get(row,...names){const map={};Object.keys(row||{}).forEach(k=>map[norm(k)]=row[k]);for(const name of names){const key=norm(name);if(Object.prototype.hasOwnProperty.call(map,key))return map[key];}return '';}
  function money(v){if(typeof v==='number')return Math.abs(v)||0;const s=String(v||'').replace(/R\$|\s/g,'').replace(/\./g,'').replace(',', '.');return Math.abs(parseFloat(s))||0;}
  const ini=_todayStart();const fim=_addDays(ini,7);let entradas=0,saidas=0,pend=0;
  (raw.lancamentosRows||[]).forEach(row=>{
    const tipoRaw=norm(get(row,'Tipo'));const tipo=tipoRaw.includes('entrada')?'entrada':(tipoRaw.includes('saida')?'saida':'');if(!tipo)return;
    const statusRaw=norm(get(row,'Status'));if(statusRaw.includes('cancel'))return;
    const status=(statusRaw.includes('real')||statusRaw.includes('pago')||statusRaw.includes('quitado'))?'realizado':'previsto';
    const dataPrev=_tdComp(get(row,'Data prevista','Data Prevista'));const dataReal=_tdComp(get(row,'Data realizada','Data Realizada'));
    const dataStr=(status==='realizado'&&dataReal)?dataReal:dataPrev;if(!dataStr)return;
    const d=parseToDate(dataStr);if(!d||d<ini||d>fim)return;
    const valorPrev=money(get(row,'Valor previsto (R$)','Valor previsto','Valor Previsto'));
    const valorReal=money(get(row,'Valor realizado (R$)','Valor realizado','Valor Realizado'));
    const valor=(status==='realizado'&&valorReal>0)?valorReal:valorPrev;if(!valor)return;
    if(tipo==='entrada')entradas+=valor;else saidas+=valor;if(status!=='realizado')pend++;
  });
  return {entradas,saidas,saldo:entradas-saidas,pend};
}
function renderManagementMetrics(list,oficina,filaPeca,filaAgendar,filaAgend,totCompras){
  const el=document.getElementById('managementSection');if(!el)return;
  const today=_todayStart();
  const atrasados=list.filter(o=>o.entregaDate&&o.entregaDate<today);
  const proximos7=list.filter(o=>o.entregaDate&&o.entregaDate>=today&&o.entregaDate<=_addDays(today,7));
  const semPrevisao=list.filter(o=>!o.entregaDate);
  const comEntrada=list.filter(o=>o.entradaDate);
  const diasAtivos=comEntrada.map(o=>_daysBetweenDates(o.entradaDate,today)).filter(v=>v!==null);
  const mediaDias=diasAtivos.length?Math.round(diasAtivos.reduce((a,b)=>a+b,0)/diasAtivos.length):0;
  const top=_topEtapa(oficina);
  const fluxo=_getFluxoSemanaResumo();
  const taxaAtraso=list.length?Math.round((atrasados.length/list.length)*100):0;
  const pecasVeiculos=filaPeca.length;
  const muitoTempoEtapa=getLongStageVehicles(list);
  const etapaExtra=muitoTempoEtapa.length?`<div class="metric-list">${muitoTempoEtapa.slice(0,3).map(o=>`<div class="metric-mini">${escapeHtml(_longStageText(o))}</div>`).join('')}</div>`:'';
  const gargaloExtra=top.qtd?`<div class="metric-list"><div class="metric-mini">${escapeHtml(top.nome)} concentra ${top.qtd} veículo(s)</div><div class="metric-mini">Oficina: ${Object.values(oficina||{}).reduce((s,a)=>s+(a||[]).length,0)} em produção</div></div>`:'';
  const fluxoSub=fluxo?`${fmtMoney(fluxo.entradas)} a receber · ${fmtMoney(fluxo.saidas)} a pagar`:'Sem aba de lançamentos carregada';
  const fluxoValue=fluxo?fmtMoney(fluxo.saldo):'—';
  const acao=atrasados.length?'Regularizar atrasos':totCompras?'Comprar peças':semPrevisao.length?'Definir previsões':proximos7.length?'Preparar entregas':'Operação estável';
  el.innerHTML=`
    <div class="management-panel">
      <div class="management-hdr">
        <div><div class="management-title">📈 Métricas gerenciais</div><div class="management-sub">Indicadores para decisão rápida, gargalos e risco operacional.</div></div>
        <span class="sec-badge">PR6 · visão de gestão</span>
      </div>
      <div class="management-grid">
        ${_metricCard('Tempo médio ativo',`${mediaDias}<span style="font-size:17px;font-weight:500"> dias</span>`,`Base: ${diasAtivos.length} carro(s) com data de entrada`,'var(--blue)', '', mediaDias>20?'metric-warn':'')}
        ${_metricCard('Risco de atraso',`${atrasados.length}<span style="font-size:17px;font-weight:500"> (${taxaAtraso}%)</span>`,`${proximos7.length} entrega(s) nos próximos 7 dias`,'var(--red)', '', atrasados.length?'metric-alert':'metric-ok')}
        ${_metricCard('Gargalo da oficina',escapeHtml(top.nome),top.qtd?`${top.qtd} carro(s) nesta etapa`:'Sem gargalo identificado','var(--orange)', gargaloExtra, top.qtd>=4?'metric-warn':'')}
        ${_metricCard('Peças pendentes',totCompras,`${pecasVeiculos} carro(s) aguardando peça`,'var(--purple)', '', totCompras?'metric-alert':'metric-ok')}
        ${_metricCard('Muito tempo na etapa',muitoTempoEtapa.length,'Veículos acima do prazo da etapa atual','var(--red)', etapaExtra, muitoTempoEtapa.length?'metric-alert':'metric-ok')}
        ${_metricCard('Sem previsão',semPrevisao.length,'Carros sem data de entrega definida','var(--yellow)', '', semPrevisao.length?'metric-warn':'metric-ok')}
        ${_metricCard('Agendados',filaAgend.length,`${filaAgendar.length} ainda precisam ser agendados`,'var(--teal)', '', filaAgendar.length?'metric-warn':'')}
        ${_metricCard('Fluxo 7 dias',fluxoValue,fluxoSub,'var(--green)', fluxo?`<div class="metric-list"><div class="metric-mini">${fluxo.pend} lançamento(s) pendente(s)</div></div>`:'', fluxo&&fluxo.saldo<0?'metric-alert':'')}
        ${_metricCard('Próxima ação',escapeHtml(acao),'Prioridade sugerida com base nos dados atuais','var(--blue)')}
      </div>
    </div>`;
}

function filaCard(o){
  const [ps,pl]=pecasStatus(o);
  const m={ok:'tag-ok',no:'tag-err',par:'tag-warn'};
  let tags=`<span class="tag ${m[ps]}">${pl}</span>`;
  if(o.tinta==='comprar')tags+=`<span class="tag tag-err">Sem tinta</span>`;
  else tags+=`<span class="tag tag-ok">Tinta OK</span>`;
  if(o.agendamento&&o.agendamento!=='—')tags+=`<span class="tag tag-info">${o.agendamento}</span>`;
  return`<div class="car-card"><div class="plate">${escapeHtml(o.placa)}</div>
    <div class="car-model">${escapeHtml(o.veiculo)}${o.cor?' · '+escapeHtml(o.cor):''}</div>
    <div class="car-owner">${escapeHtml(o.cliente)}</div>
    <div class="card-tags">${tags}</div></div>`;
}
function etapaCard(o){
  return`<div class="etapa-card"><div class="plate">${escapeHtml(o.placa)}</div>

// ── AGENDA ──
function renderAgenda(list){
  const today=new Date();today.setHours(0,0,0,0);
  const withDate=list.filter(o=>o.entregaDate).sort((a,b)=>a.entregaDate-b.entregaDate);

  function dateKey(d){
    const x=new Date(d);x.setHours(0,0,0,0);
    return localDateISO(x);
  }
  function startOfWeek(d){
    const x=new Date(d);x.setHours(0,0,0,0);
    const day=x.getDay();
    const diff=(day===0?-6:1-day); // segunda-feira
    x.setDate(x.getDate()+diff);
    return x;
  }
  function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function labelPeriodo(inicio){
    const fim=addDays(inicio,6);
    const iniTxt=`${inicio.getDate().toString().padStart(2,'0')} ${MESES_PT[inicio.getMonth()]}`;
    const fimTxt=`${fim.getDate().toString().padStart(2,'0')} ${MESES_PT[fim.getMonth()]} ${fim.getFullYear()}`;
    return `${iniTxt} a ${fimTxt}`;
  }
  function weekTitle(inicio){
    const fim=addDays(inicio,6);
    return `${inicio.getDate().toString().padStart(2,'0')}/${(inicio.getMonth()+1).toString().padStart(2,'0')} – ${fim.getDate().toString().padStart(2,'0')}/${(fim.getMonth()+1).toString().padStart(2,'0')}`;
  }

  const byDate={};
  withDate.forEach(o=>{
    const key=dateKey(o.entregaDate);
    if(!byDate[key])byDate[key]=[];
    byDate[key].push(o);
  });

  const weekKeys=new Map();
  const currentWeek=startOfWeek(today);
  weekKeys.set(dateKey(currentWeek),currentWeek);
  withDate.forEach(o=>{
    const wk=startOfWeek(o.entregaDate);
    weekKeys.set(dateKey(wk),wk);
  });
  const weeks=Array.from(weekKeys.values()).sort((a,b)=>a-b);

  const totalDatas=Object.keys(byDate).length;
  const badgeText=totalDatas?`${totalDatas} datas · ${withDate.length} veículos`:`Semana atual · 0 veículos`;

  const weekHtml=weeks.map(weekStart=>{
    const isCurrent=dateKey(weekStart)===dateKey(currentWeek);
    let weekCount=0;
    const daysHtml=Array.from({length:7},(_,idx)=>{
      const d=addDays(weekStart,idx);d.setHours(0,0,0,0);
      const key=dateKey(d);
      const orcs=byDate[key]||[];
      weekCount+=orcs.length;
      const diff=Math.round((d-today)/(1000*60*60*24));
      let cls=orcs.length?'':'empty';
      let miniBadge='';
      if(diff<0&&orcs.length){cls+=' overdue';miniBadge='<span class="agenda-mini-badge" style="color:var(--red)">Atrasado</span>';}
      else if(diff===0){cls+=' today';miniBadge='<span class="agenda-mini-badge" style="color:var(--green)">Hoje</span>';}
      else if(diff>0&&diff<=3&&orcs.length){cls+=' soon';miniBadge=`<span class="agenda-mini-badge" style="color:var(--orange)">${diff}d</span>`;}

      const items=orcs.map(o=>{
        const [bg,fg]=ETAPA_COLORS[o.etapa]||['#eee','#333'];
        return`<div class="agenda-item">
          <div class="agenda-item-main">
            <div style="min-width:0;">
              <div class="agenda-plate">${escapeHtml(o.placa)}</div>
              <div class="agenda-car">${escapeHtml(o.veiculo)}${o.cor?' · '+escapeHtml(o.cor):''}</div>
              <div class="agenda-client">${escapeHtml(o.cliente)}</div>
            </div>
            <span class="agenda-etapa-badge" style="background:${bg};color:${fg}">${escapeHtml(o.etapa)}</span>
          </div>
        </div>`;
      }).join('');

      return`<div class="agenda-dia ${cls.trim()}">
        <div class="agenda-dia-hdr">
          <div style="min-width:0;">
            <div class="agenda-dia-head-left">
              <span class="agenda-dia-dow">${DIAS_PT[d.getDay()]}</span>
              <span class="agenda-dia-data">${d.getDate().toString().padStart(2,'0')}</span>
              <span class="agenda-dia-mes">${MESES_PT[d.getMonth()]}</span>
            </div>
            ${miniBadge}
          </div>
          <div class="agenda-dia-count">${orcs.length}</div>
        </div>
        <div class="agenda-dia-body">${items||'<div class="agenda-empty">Nenhuma entrega</div>'}</div>
      </div>`;
    }).join('');

    return`<div class="agenda-week ${isCurrent?'current':''}">
      <div class="agenda-week-hdr">
        <div>
          <div class="agenda-week-title">${isCurrent?'Semana atual':'Semana'} · ${weekTitle(weekStart)}</div>
          <div class="agenda-week-sub">${labelPeriodo(weekStart)}</div>
        </div>
        <span class="agenda-week-badge">${weekCount} ${weekCount===1?'entrega':'entregas'}</span>
      </div>
      <div class="agenda-week-grid">${daysHtml}</div>
    </div>`;
  }).join('');

  document.getElementById('agendaSection').innerHTML=`
    <div class="sec-hdr"><span class="sec-title">Agenda de Entregas</span>
      <span class="sec-badge">${badgeText}</span>
      <div class="sec-line"></div></div>
    <div class="agenda-weeks">${weekHtml}</div>`;
}

function buildPrint(){
  const now=new Date();
  const dt=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const oficina=Object.values(G.active).filter(o=>ETAPAS_OFICINA.includes(o.etapa));
  const fila=Object.values(G.active).filter(o=>['Aguardando peça','Agendar','Agendado'].includes(o.etapa));

  function esc(v){
    return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }
  function parsePrintDate(v){
    if(!v||v==='—')return null;
    if(v instanceof Date&&!isNaN(v))return new Date(v.getFullYear(),v.getMonth(),v.getDate());
    const s=String(v).trim();
    let p=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if(p){const yr=Number(p[3].length===2?'20'+p[3]:p[3]);return new Date(yr,Number(p[2])-1,Number(p[1]));}
    p=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(p)return new Date(Number(p[1]),Number(p[2])-1,Number(p[3]));
    const d=new Date(s);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
  }
  function dateKeyLocal(d){
    if(!d)return'';
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function startOfWeekLocal(d){
    const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    const day=x.getDay();
    x.setDate(x.getDate()+(day===0?-6:1-day));
    return x;
  }
  function addDaysLocal(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
  function okCell(show){return `<td class="${show?'p-ok':'p-blank'}">${show?'OK':''}</td>`;}

  // Página 1: oficina
  let rows='';
  oficina.forEach(o=>{
    const pecasOk=o.pecasTotal>0&&o.pecasEntregues===o.pecasTotal;
    const tintaOk=o.tinta!=='comprar';
    const idx=ETAPAS_OFICINA.indexOf(o.etapa);
    const veiculoCor=`${o.veiculo||'—'}${o.cor?' · '+o.cor:''}`;
    rows+=`<tr class="print-vehicle-row">
      <td class="p-plate" style="width:9%">${esc(o.placa||'—')}</td>
      <td class="p-vehicle" style="width:19%">${esc(veiculoCor)}</td>
      <td class="p-client" style="width:16%">${esc(o.cliente||'—')}</td>
      ${okCell(pecasOk)}
      ${okCell(tintaOk)}
      ${ETAPAS_OFICINA.map((_,i)=>okCell(idx>=0&&i<=idx)).join('')}
    </tr>`;
    if(o.comentario){
      rows+=`<tr class="print-obs-row"><td colspan="11"><span class="print-obs-label">Observação</span>${esc(o.comentario)}</td></tr>`;
    }
  });
  document.getElementById('printOficina').innerHTML=`
    <div class="print-header"><div class="print-title">Melo Reparos — Carros na Oficina</div>
      <div class="print-sub">Emitido em ${dt} · ${oficina.length} veículos</div></div>
    <table class="print-table"><thead><tr>
      <th style="width:9%">Placa</th><th style="width:19%">Veículo / Cor</th><th style="width:16%">Cliente</th><th>Peças</th><th>Tinta</th>
      <th>Desmont.</th><th>Funilaria</th><th>Prep.</th><th>Pintura</th><th>Montagem</th><th>Polimento</th>
    </tr></thead><tbody>${rows||'<tr><td colspan="11" style="text-align:center;padding:12px">Nenhum veículo</td></tr>'}</tbody></table>`;

  // Página 2: agendados em calendário + listas simples
  const fp=fila.filter(o=>o.etapa==='Aguardando peça');
  const fa=fila.filter(o=>o.etapa==='Agendar');
  const fg=fila.filter(o=>o.etapa==='Agendado');

  function filaItems(lst){
    if(!lst.length)return'<div class="print-fila-item" style="color:#94a3b8;font-style:italic">Nenhum veículo</div>';
    return lst.map(o=>`<div class="print-fila-item">
      <div class="pfi-plate">${esc(o.placa||'—')}</div>
      <div>${esc(o.veiculo||'—')}${o.cor?' · '+esc(o.cor):''}</div>
      <div style="color:#5a6a7e">${esc(o.cliente||'—')}</div>
      <div style="color:#5a6a7e;font-size:9px">Agend.: ${esc(o.agendamento||'—')} · Prev.: ${esc(o.entrega||'—')}${o.comentario?'<br>⚠ '+esc(o.comentario):''}</div>
    </div>`).join('');
  }

  function agendaCalendar(lst){
    if(!lst.length)return'<div class="print-calendar"><div class="print-calendar-title">🗓 Veículos agendados (0)</div><div class="print-fila-item" style="color:#94a3b8;font-style:italic">Nenhum veículo agendado</div></div>';
    const items=lst.map(o=>({o,d:parsePrintDate(o.agendamento)})).sort((a,b)=>(a.d?+a.d:9e15)-(b.d?+b.d:9e15));
    const valid=items.filter(x=>x.d);
    const today=new Date();const currentWeek=startOfWeekLocal(today);
    let min=valid.length?startOfWeekLocal(valid[0].d):currentWeek;
    let max=valid.length?startOfWeekLocal(valid[valid.length-1].d):currentWeek;
    if(currentWeek<min)min=currentWeek;
    if(currentWeek>max)max=currentWeek;
    const byDate={};
    items.forEach(x=>{const k=x.d?dateKeyLocal(x.d):'sem-data';if(!byDate[k])byDate[k]=[];byDate[k].push(x.o);});
    let days=[];
    for(let d=new Date(min);d<=addDaysLocal(max,6);d=addDaysLocal(d,1))days.push(d);
    const grid=days.map(d=>{
      const k=dateKeyLocal(d);const lst=byDate[k]||[];
      const head=`${DIAS_PT[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
      const content=lst.map(o=>`<div class="print-cal-item"><div class="print-cal-plate">${esc(o.placa||'—')}</div><div>${esc(o.veiculo||'—')}${o.cor?' · '+esc(o.cor):''}</div></div>`).join('');
      return `<div class="print-cal-day ${lst.length?'':'empty'}"><div class="print-cal-head"><span>${head}</span><span>${lst.length}</span></div>${content||'<div style="font-size:8.5px;color:#94a3b8">—</div>'}</div>`;
    }).join('');
    return `<div class="print-calendar"><div class="print-calendar-title">🗓 Veículos agendados (${lst.length})</div><div class="print-calendar-grid">${grid}</div></div>`;
  }

  document.getElementById('printFila').innerHTML=`
    <div class="print-header"><div class="print-title">Melo Reparos — Agendamentos e Fila de Espera</div>
      <div class="print-sub">Emitido em ${dt} · ${fila.length} veículos</div></div>
    ${agendaCalendar(fg)}
    <div class="print-fila-grid">
      <div class="print-fila-col pfc-peca"><div class="print-fila-hdr">⏳ Aguardando Peça (${fp.length})</div>${filaItems(fp)}</div>
      <div class="print-fila-col pfc-agendar"><div class="print-fila-hdr">📅 Aguardando Agendamento (${fa.length})</div>${filaItems(fa)}</div>
    </div>`;
}
function printReport(){
  if(!Object.keys(G.active).length){showAppNotice('Carregue a planilha primeiro','Importe a planilha de controle antes de abrir esta página.','error');return;}
  buildPrint();
  window.print();
}

function _buildRawForRelatorio(rowsOrc,rowsItens,comprasRaw){
  function td(v){
    const d=parseToDate(v);
    return d?localDateISO(d):null;
  }
  function sf(v){try{return parseFloat(v)||0;}catch{return 0;}}
  function nt(t){const s=String(t||'').trim().toLowerCase();
    if(['segurado','seguro'].includes(s))return'Segurado';
    if(s==='terceiro')return'Terceiro';
    if(['particular','paricular'].includes(s))return'Particular';
    if(['logista','logista'].includes(s))return'Logista';
    if(s==='carglass')return'Carglass';
    if(s==='maxpar')return'Maxpar';
    return String(t||'').trim();}
  const orcs=[];
  for(let i=1;i<rowsOrc.length;i++){
    const r=rowsOrc[i];if(!r[0])continue;
    orcs.push({
      orcId:r[0],
      placa:String(r[2]||'').trim(),
      veiculo:String(r[3]||'').trim(),
      carro:String(r[3]||'').trim(),
      cor:String(r[5]||'').trim(),
      cliente:String(r[8]||'').trim(),
      agendamento:td(r[11]),entrada:td(r[12]),prevEntrega:td(r[13]),entregue:td(r[20]),
      etapaDesde:td(getEtapaAtualTimingFromRow(r,String(r[10]||'').trim()).inicioRaw),
      tipo:nt(r[6]),etapa:String(r[10]||'').trim(),seguro:String(r[7]||'').trim(),qntTinta:sf(r[15]),pecasOficina:sf(r[22]),mo:sf(r[23]),total:sf(r[24])
    });
  }
  const itens=[];
  for(let i=1;i<rowsItens.length;i++){
    const r=rowsItens[i];if(!r[0])continue;
    itens.push({orcId:r[0],desc:String(r[2]||''),troca:String(r[3]||'').toUpperCase(),
      forn:String(r[5]||''),custo:sf(r[8]),pinturas:sf(r[13])});
  }
  return{orcs,itens,compras:comprasRaw||[]};
}

function _normFluxoName(v){
  return String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function _findFluxoSheet(wb,candidates){
  const wanted=candidates.map(_normFluxoName);
  return (wb.SheetNames||[]).find(n=>wanted.includes(_normFluxoName(n)))||null;
}
function _buildRawForFluxoCaixa(wb,filename){
  const lancSheet=_findFluxoSheet(wb,['Lancamentos','Lançamentos','Lancamento','Lançamento']);
  if(!lancSheet)return null;
  const lancamentosRows=XLSX.utils.sheet_to_json(wb.Sheets[lancSheet],{defval:'',raw:true});
  const resumoSheet=_findFluxoSheet(wb,['Resumo_Mensal','Resumo Mensal']);
  const saldoInicial=(resumoSheet&&wb.Sheets[resumoSheet]&&wb.Sheets[resumoSheet]['B4'])?wb.Sheets[resumoSheet]['B4'].v:0;
  return{filename,lancamentosRows,saldoInicial};
}


function _hojeISOlocal(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// PR15: restaura a Visão Geral ao voltar de outras páginas.
// Antes, os dados eram preservados no storage, mas o dashboard não reconstruía a tela ao ser aberto novamente.
function readMeloStorage(key){
  const sources=[sessionStorage,localStorage];
  for(const st of sources){
    try{
      const raw=st.getItem(key);
      if(!raw)continue;
      return JSON.parse(raw);
    }catch(e){console.warn('Falha ao ler dados salvos:',key,e);}
  }
  return null;
}
function restoreDashboardFromStorage(){
  try{
    if(G&&G.active&&Object.keys(G.active).length)return false;
    const oper=readMeloStorage('melooperacional');
    if(!oper||!oper.active||!Object.keys(oper.active).length)return false;

    G={
      active:hydrateOperationalActive(oper.active||{}),
      entregues:Array.isArray(oper.entregues)?oper.entregues.map(hydrateVehicleDates):[],
      compras:oper.compras||{},
      mesNome:oper.mesNome||'',
      filename:oper.filename||'Planilha carregada'
    };

    const rel=readMeloStorage('melorelatorio');
    const fluxo=readMeloStorage('melofluxocaixa');
    if(rel&&Array.isArray(rel.orcs))window._rawRelatorio=rel;
    if(fluxo&&Array.isArray(fluxo.lancamentosRows))window._rawFluxoCaixa=fluxo;

    const activeList=Object.values(G.active||{});
    const selV=document.getElementById('vehicleSelect');
    if(selV){
      selV.innerHTML='<option value="">Todos</option>';
      activeList.slice().sort((a,b)=>String(a.placa||'').localeCompare(String(b.placa||''))).forEach(o=>{
        selV.innerHTML+=`<option value="${escapeAttr(o.orcId)}">${escapeHtml(o.placa)} — ${escapeHtml(o.veiculo)}</option>`;
      });
    }
    const selE=document.getElementById('etapaSelect');
    if(selE){
      const etapasUnicas=[...new Set(activeList.map(o=>o.etapa).filter(Boolean))].sort();
      selE.innerHTML='<option value="">Todas</option>';
      etapasUnicas.forEach(e=>selE.innerHTML+=`<option value="${escapeAttr(e)}">${escapeHtml(e)}</option>`);
    }

    const last=document.getElementById('lastUpdate');
    if(last){
      const restoredAt=oper.geradoEm?` · dados salvos em ${escapeHtml(oper.geradoEm)}`:'';
      last.innerHTML=`<strong>${escapeHtml(G.filename)}</strong>${restoredAt}`;
    }
    const searchBar=document.getElementById('searchBar');
    if(searchBar)searchBar.classList.add('visible');
    const hdr=document.getElementById('hdrControls');
    if(hdr)hdr.style.display='flex';
    const loading=document.getElementById('loading');
    if(loading)loading.style.display='none';
    const splash=document.getElementById('splash');
    if(splash)splash.style.display='none';
    const content=document.getElementById('content');
    if(content)content.style.display='block';

    clearAppNotice();
    renderAll(activeList);
    buildPrint();
    saveAllDataSnapshots();
    return true;
  }catch(e){
    console.error('Erro ao restaurar Visão Geral:',e);
    return false;
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  if(window.preserveMeloData)window.preserveMeloData();
  restoreDashboardFromStorage();
});

</script>

<script>
// PR14: ponte de persistência entre páginas.
// Evita que os dados se percam ao navegar por Relatórios/Financeiro/Produção/Compras.
(function(){
  const KEYS=['melorelatorio','melofluxocaixa','melohoje','melooperacional'];
  function getRaw(storage,key){try{return storage.getItem(key)||'';}catch(e){return '';}}
  function setRaw(storage,key,value){try{if(value)storage.setItem(key,value);return true;}catch(e){console.warn('Falha ao preservar dados em storage:',key,e);return false;}}
  function bestRaw(key){return getRaw(sessionStorage,key)||getRaw(localStorage,key);}
  function preserveMeloData(){
    KEYS.forEach(key=>{
      const raw=bestRaw(key);
      if(!raw)return;
      if(!getRaw(sessionStorage,key))setRaw(sessionStorage,key,raw);
      if(!getRaw(localStorage,key))setRaw(localStorage,key,raw);
    });
  }
  window.preserveMeloData=preserveMeloData;
  document.addEventListener('DOMContentLoaded',()=>{
    preserveMeloData();
    document.querySelectorAll('a.app-tab[href]').forEach(a=>{
      a.addEventListener('click',()=>preserveMeloData(),{capture:true});
    });
  });
  window.addEventListener('pagehide',preserveMeloData);
})();
</script>
